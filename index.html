<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#fff;font-family:Arial}
.signal{
    background:#111;
    padding:20px;
    margin:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div id="signals"></div>

<script>

let data = [
    {symbol:"EUR/USD", signal:"BUY"},
    {symbol:"USD/JPY", signal:"SELL"}
]

let container = document.getElementById("signals")

data.forEach((s,i)=>{
    let div = document.createElement("div")
    div.className = "signal"
    div.innerText = s.symbol + " " + s.signal

    div.addEventListener("click", ()=>{
        alert("CLICK OK: " + s.symbol)
    })

    container.appendChild(div)
})

</script>

</body>
</html>

</html>
