<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#fff;font-family:Arial}
.signal{
    background:#111;
    padding:20px;
    margin:10px;
    border-radius:12px;
}
</style>
</head>

<body>

<div id="signals"></div>

<script>

let signalsData = []

async function load(){
    let res = await fetch("https://signals-app-yk11.onrender.com/signals")
    signalsData = await res.json()

    let container = document.getElementById("signals")
    container.innerHTML=""

    signalsData.forEach((s,i)=>{
        let div = document.createElement("div")
        div.className="signal"

        div.innerText = s.symbol + " " + s.signal

        // 👉 САМЫЙ НАДЁЖНЫЙ СПОСОБ
        div.onclick = function(){
            alert("CLICK OK: " + s.symbol)
        }

        container.appendChild(div)
    })
}

setInterval(load,2000)
load()

</script>

</body>
</html>
