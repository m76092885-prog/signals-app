<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
AI Futures Sniper
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:
    radial-gradient(
        circle at top,
        #12203d,
        #050816 45%,
        #02040a 100%
    );

    color:white;

    width:100vw;
    height:100vh;

    overflow:hidden;
}

.screen{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    padding:20px;
}

.active{
    display:flex;
}

.panel{

    width:min(92vw,430px);

    background:
    rgba(255,255,255,0.05);

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:
    blur(25px);

    border-radius:30px;

    padding:30px;

    box-shadow:
    0 0 40px rgba(0,255,255,0.15);
}

.logo{

    font-size:34px;

    text-align:center;

    font-weight:800;

    color:#00ffee;

    text-shadow:
    0 0 20px #00ffee;

    margin-bottom:20px;
}

.subtitle{

    text-align:center;

    opacity:0.7;

    line-height:1.5;

    margin-bottom:35px;
}

.btn{

    width:100%;

    padding:18px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        90deg,
        #00ffee,
        #00bfff
    );

    color:#001018;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    margin-top:18px;
}

.select{

    width:100%;

    padding:18px;

    margin-top:18px;

    border:none;

    border-radius:18px;

    background:#111827;

    color:white;

    font-size:16px;
}

.option{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:20px;
}

.radar{

    width:200px;
    height:200px;

    border-radius:50%;

    border:5px solid #00ffee;

    box-shadow:
    0 0 35px #00ffee;

    animation:
    spin 3s linear infinite;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.scanText{

    margin-top:40px;

    font-size:26px;

    color:#00ffee;

    text-align:center;
}

.scanChecks{

    margin-top:30px;

    display:flex;

    flex-direction:column;

    gap:12px;

    opacity:0.8;
}

.signalBox{

    width:min(92vw,520px);

    background:
    rgba(255,255,255,0.05);

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:
    blur(25px);

    border-radius:30px;

    padding:30px;

    box-shadow:
    0 0 40px rgba(0,255,255,0.15);
}

.signalTitle{

    font-size:34px;

    color:#00ffee;

    margin-bottom:20px;

    font-weight:800;
}

.signalSide{

    font-size:28px;

    font-weight:800;

    margin-bottom:25px;
}

.buy{
    color:#00ff88;
}

.sell{
    color:#ff3355;
}

.metric{

    margin-top:15px;

    font-size:20px;
}

.confidence{

    margin-top:25px;

    font-size:42px;

    color:#00ffee;

    font-weight:800;
}

.reasonBox{

    margin-top:25px;

    padding:18px;

    border-radius:18px;

    background:
    rgba(255,255,255,0.04);
}

.reason{

    margin-top:10px;

    opacity:0.8;
}

</style>

</head>

<body>

<div class="screen active"
id="homeScreen">

    <div class="panel">

        <div class="logo">

            AI FUTURES SNIPER

        </div>

        <div class="subtitle">

            The Most Powerful AI Futures Trading System

        </div>

        <button class="btn"
        onclick="show('settingsScreen')">

            GET SIGNAL

        </button>

    </div>

</div>

<div class="screen"
id="settingsScreen">

    <div class="panel">

        <button class="btn"
        onclick="show('homeScreen')">

            BACK

        </button>

        <div class="logo">

            SIGNAL SETTINGS

        </div>

        <select class="select"
        id="asset">

            <option>

                CC1!

            </option>

        </select>

        <select class="select"
        id="timeframe">

            <option value="3m">

                3 MIN

            </option>

            <option value="5m">

                5 MIN

            </option>

            <option value="15m">

                15 MIN

            </option>

        </select>

        <div class="option">

            <input type="checkbox"
            id="trendOnly">

            <label>

                ONLY TREND TRADES

            </label>

        </div>

        <button class="btn"
        onclick="startScan()">

            START AI SCAN

        </button>

    </div>

</div>

<div class="screen"
id="scanScreen">

    <div class="radar"></div>

    <div class="scanText">

        SCANNING MARKET STRUCTURE...

    </div>

    <div class="scanChecks">

        <div>

            ✔ Liquidity Sweep

        </div>

        <div>

            ✔ Volume Confirmation

        </div>

        <div>

            ✔ Momentum Analysis

        </div>

        <div>

            ✔ Smart Money Detection

        </div>

    </div>

</div>

<div class="screen"
id="signalScreen">

    <div class="signalBox">

        <button class="btn"
        onclick="show('homeScreen')">

            BACK

        </button>

        <div class="signalTitle">

            ELITE ENTRY

        </div>

        <div class="signalSide"
        id="side">

            BUY

        </div>

        <div class="metric"
        id="assetText">

            ASSET: CC1!

        </div>

        <div class="metric"
        id="entry">

            ENTRY: 0

        </div>

        <div class="metric"
        id="sl">

            SL: 0

        </div>

        <div class="metric"
        id="tp">

            TP1: 0 | TP2: 0

        </div>

        <div class="confidence"
        id="confidence">

            84%

        </div>

        <div class="reasonBox"
        id="reasons">

        </div>

    </div>

</div>

<script>

const API =
"https://signals-ai-backend.onrender.com"

function show(id){

    document
    .querySelectorAll(".screen")
    .forEach(s =>

        s.classList.remove("active")

    )

    document
    .getElementById(id)
    .classList.add("active")
}

async function startScan(){

    show("scanScreen")

    const asset =
    document
    .getElementById("asset")
    .value

    const timeframe =
    document
    .getElementById("timeframe")
    .value

    const trendOnly =
    document
    .getElementById("trendOnly")
    .checked

    try{

        const response =
        await fetch(

            `${API}/signal?asset=${asset}&timeframe=${timeframe}&trend_only=${trendOnly}`

        )

        const data =
        await response.json()

        console.log(data)

        showSignal(data)

    }catch(err){

        console.log(err)

        alert("Backend connection error")

        show("homeScreen")
    }
}

function showSignal(data){

    show("signalScreen")

    const side =
    document
    .getElementById("side")

    side.innerText =
    data.side

    side.className =
    "signalSide " +

    (
        data.side === "BUY"
        ? "buy"
        : "sell"
    )

    document
    .getElementById("assetText")
    .innerText =

    "ASSET: " +

    data.asset

    document
    .getElementById("entry")
    .innerText =

    "ENTRY: " +

    data.entry

    document
    .getElementById("sl")
    .innerText =

    "SL: " +

    data.sl

    document
    .getElementById("tp")
    .innerText =

    "TP1: " +

    data.tp1 +

    " | TP2: " +

    data.tp2

    document
    .getElementById("confidence")
    .innerText =

    data.confidence +

    "% SUCCESS"

    const reasons =
    document
    .getElementById("reasons")

    reasons.innerHTML = ""

    data.reasons.forEach(r => {

        reasons.innerHTML +=

        `<div class="reason">

            • ${r}

        </div>`
    })
}

</script>

</body>

</html>
