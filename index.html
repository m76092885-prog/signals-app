<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>CYBER AI TERMINAL</title>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#050816;

    color:white;

    font-family:Arial;

    overflow-x:hidden;
}

/* ========================================== */
/* BACKGROUND */
/* ========================================== */

.bg{

    position:fixed;

    width:100%;
    height:100%;

    background:
    radial-gradient(circle at top,#00f0ff22,transparent 40%),
    radial-gradient(circle at bottom,#ff00ff22,transparent 40%),
    #050816;

    z-index:-2;
}

.grid{

    position:fixed;

    width:100%;
    height:100%;

    background-image:
    linear-gradient(#0ff1 1px, transparent 1px),
    linear-gradient(90deg,#0ff1 1px, transparent 1px);

    background-size:40px 40px;

    opacity:0.12;

    z-index:-1;
}

/* ========================================== */
/* TITLE */
/* ========================================== */

.title{

    text-align:center;

    margin-top:20px;

    font-size:34px;

    font-weight:bold;

    color:#00f0ff;

    text-shadow:
    0 0 10px #00f0ff,
    0 0 20px #00f0ff;
}

/* ========================================== */
/* CONTAINER */
/* ========================================== */

.container{

    padding:20px;

    display:flex;

    flex-direction:column;

    gap:20px;
}

/* ========================================== */
/* CARD */
/* ========================================== */

.signal{

    background:#0b1224dd;

    border:1px solid #00f0ff44;

    border-radius:20px;

    padding:20px;

    backdrop-filter:blur(10px);

    box-shadow:
    0 0 20px #00f0ff22;

    transition:0.3s;
}

.signal:hover{

    transform:translateY(-3px);

    box-shadow:
    0 0 30px #00f0ff55;
}

/* ========================================== */
/* BUY SELL */
/* ========================================== */

.buy{

    border-left:5px solid #00ff88;
}

.sell{

    border-left:5px solid #ff3355;
}

/* ========================================== */
/* ROW */
/* ========================================== */

.row{

    display:flex;

    justify-content:space-between;

    margin-top:10px;

    font-size:15px;
}

/* ========================================== */
/* BUTTON */
/* ========================================== */

.btn{

    margin-top:15px;

    width:100%;

    padding:12px;

    border:none;

    border-radius:15px;

    background:#00f0ff22;

    color:#00f0ff;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.btn:hover{

    background:#00f0ff44;
}

/* ========================================== */
/* MODAL */
/* ========================================== */

.modal{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:92%;

    max-width:420px;

    background:#0b1224ee;

    border:1px solid #00f0ff55;

    border-radius:20px;

    padding:20px;

    display:none;

    z-index:999;

    backdrop-filter:blur(10px);

    box-shadow:
    0 0 40px #00f0ff55;
}

.close{

    margin-top:20px;

    width:100%;

    padding:12px;

    border:none;

    border-radius:15px;

    background:#ff003322;

    color:#ff3355;

    font-weight:bold;
}

/* ========================================== */
/* LEVEL COLORS */
/* ========================================== */

.levelAplus{

    color:#00f0ff;
}

.levelA{

    color:#00ff88;
}

.levelB{

    color:#ffaa00;
}

/* ========================================== */
/* ANALYTICS */
/* ========================================== */

.analytics{

    border:1px solid #00ff8844;

    box-shadow:
    0 0 20px #00ff8822;
}

canvas{

    margin-top:15px;

    width:100%;

    height:80px;

    background:#00000033;

    border-radius:12px;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="grid"></div>

<div class="title">
😈 CYBER AI TERMINAL
</div>

<div class="container">

<!-- ========================================== -->
<!-- ANALYTICS -->
<!-- ========================================== -->

<div class="signal analytics">

<h2>
📊 AI ANALYTICS
</h2>

<div class="row">
<span>Total Signals</span>
<span id="totalSignals">0</span>
</div>

<div class="row">
<span>Wins</span>
<span id="wins">0</span>
</div>

<div class="row">
<span>Losses</span>
<span id="losses">0</span>
</div>

<div class="row">
<span>Winrate</span>
<span id="winrate">0%</span>
</div>

<div class="row">
<span>AI Engine</span>
<span style="color:#00ff88;">
ONLINE
</span>
</div>

</div>

<!-- ========================================== -->
<!-- SIGNALS -->
<!-- ========================================== -->

<div id="signals"></div>

</div>

<!-- ========================================== -->
<!-- MODAL -->
<!-- ========================================== -->

<div class="modal" id="modal">

<h2 id="pair"></h2>

<div class="row">
<span>Signal</span>
<span id="signal"></span>
</div>

<div class="row">
<span>Level</span>
<span id="level"></span>
</div>

<div class="row">
<span>Score</span>
<span id="score"></span>
</div>

<div class="row">
<span>Expiration</span>
<span id="expiration"></span>
</div>

<div class="row">
<span>Buyers</span>
<span id="buyers"></span>
</div>

<div class="row">
<span>Sellers</span>
<span id="sellers"></span>
</div>

<div class="row">
<span>ADX</span>
<span id="adx"></span>
</div>

<div class="row">
<span>RSI</span>
<span id="rsi"></span>
</div>

<div class="row">
<span>Time</span>
<span id="time"></span>
</div>

<button
class="close"
onclick="closeModal()"
>
CLOSE
</button>

</div>

<script>

/* ========================================== */
/* API */
/* ========================================== */

const API =
"https://signals-ai-backend.onrender.com/signals?v=999999";

const ANALYTICS =
"https://signals-ai-backend.onrender.com/analytics";

/* ========================================== */
/* CACHE */
/* ========================================== */

let savedSignals = {};

/* ========================================== */
/* CHART ENGINE */
/* ========================================== */

function drawChart(id, signal){

    const canvas =
    document.getElementById(id);

    if(!canvas) return;

    const ctx =
    canvas.getContext("2d");

    const width =
    canvas.width = canvas.offsetWidth;

    const height =
    canvas.height = 80;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.beginPath();

    let x = 0;

    let y =
    height / 2;

    ctx.moveTo(x, y);

    for(let i = 0; i < 30; i++){

        x += width / 30;

        if(signal === "BUY"){

            y += (
                Math.random() * 8 - 2
            );

        }else{

            y += (
                Math.random() * 8 - 6
            );
        }

        y = Math.max(
            10,
            Math.min(
                height - 10,
                y
            )
        );

        ctx.lineTo(x, y);
    }

    ctx.strokeStyle =
    signal === "BUY"
    ? "#00ff88"
    : "#ff3355";

    ctx.lineWidth = 3;

    ctx.shadowBlur = 15;

    ctx.shadowColor =
    ctx.strokeStyle;

    ctx.stroke();
}

/* ========================================== */
/* LOAD SIGNALS */
/* ========================================== */

async function loadSignals(){

    try{

        const response =
        await fetch(API);

        const data =
        await response.json();

        console.log(data);

        const container =
        document.getElementById("signals");

        data.forEach(signal => {

            const id =
            signal.pair + signal.time;

            if(savedSignals[id]){
                return;
            }

            savedSignals[id] = true;

            const card =
            document.createElement("div");

            card.className =
            `signal ${
                signal.signal === "BUY"
                ? "buy"
                : "sell"
            }`;

            let levelClass =
            "levelB";

            if(signal.level === "A"){
                levelClass = "levelA";
            }

            if(signal.level === "A+"){
                levelClass = "levelAplus";
            }

            card.innerHTML = `

                <h2>
                    ${signal.pair}
                </h2>

                <canvas
                id="chart-${id}"
                ></canvas>

                <div class="row">
                    <span>Signal</span>
                    <span>
                        ${signal.signal}
                    </span>
                </div>

                <div class="row">
                    <span>Score</span>
                    <span>
                        ${signal.score}%
                    </span>
                </div>

                <div class="row">
                    <span>Level</span>
                    <span class="${levelClass}">
                        ${signal.level}
                    </span>
                </div>

                <div class="row">
                    <span>Expiration</span>
                    <span>
                        ${signal.expiration}
                    </span>
                </div>

                <button class="btn">
                    OPEN DETAILS
                </button>

            `;

            card.onclick = () => {

                openModal(signal);
            };

            container.prepend(card);

            drawChart(
                `chart-${id}`,
                signal.signal
            );

        });

    }catch(error){

        console.log(error);
    }
}

/* ========================================== */
/* LOAD ANALYTICS */
/* ========================================== */

async function loadAnalytics(){

    try{

        const response =
        await fetch(ANALYTICS);

        const data =
        await response.json();

        document.getElementById(
            "totalSignals"
        ).innerText =
        data.total_signals;

        document.getElementById(
            "wins"
        ).innerText =
        data.wins;

        document.getElementById(
            "losses"
        ).innerText =
        data.losses;

        document.getElementById(
            "winrate"
        ).innerText =
        data.winrate + "%";

    }catch(error){

        console.log(error);
    }
}

/* ========================================== */
/* OPEN MODAL */
/* ========================================== */

function openModal(signal){

    document.getElementById(
        "modal"
    ).style.display = "block";

    document.getElementById(
        "pair"
    ).innerText =
    signal.pair;

    document.getElementById(
        "signal"
    ).innerText =
    signal.signal;

    document.getElementById(
        "level"
    ).innerText =
    signal.level;

    document.getElementById(
        "score"
    ).innerText =
    signal.score + "%";

    document.getElementById(
        "expiration"
    ).innerText =
    signal.expiration;

    document.getElementById(
        "buyers"
    ).innerText =
    signal.buyers + "%";

    document.getElementById(
        "sellers"
    ).innerText =
    signal.sellers + "%";

    document.getElementById(
        "adx"
    ).innerText =
    signal.adx;

    document.getElementById(
        "rsi"
    ).innerText =
    signal.rsi;

    document.getElementById(
        "time"
    ).innerText =
    signal.time;
}

/* ========================================== */
/* CLOSE MODAL */
/* ========================================== */

function closeModal(){

    document.getElementById(
        "modal"
    ).style.display = "none";
}

/* ========================================== */
/* START */
/* ========================================== */

loadSignals();

loadAnalytics();

setInterval(() => {

    loadSignals();

    loadAnalytics();

}, 10000);

</script>

</body>
</html>
