<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Signals</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    font-family:monospace;
    background:#070b14;
    color:white;
}

/* ===== MAIN ===== */

#main{
    width:100%;
    height:100vh;
    overflow-y:auto;
    padding:20px;
}

.title{
    font-size:26px;
    color:#ff4dff;
    margin-bottom:20px;

    text-shadow:
    0 0 10px #ff4dff;
}

/* ===== SIGNAL ===== */

.signal{

    background:
    rgba(20,20,40,0.8);

    border:
    1px solid rgba(255,0,255,0.2);

    border-radius:16px;

    padding:18px;

    margin-bottom:14px;

    transition:.2s;

    cursor:pointer;
}

.signal:hover{

    transform:scale(1.02);

    box-shadow:
    0 0 20px rgba(255,0,255,0.3);
}

.buy{
    color:#ff4dff;
}

.sell{
    color:#ff2a6d;
}

/* ===== CHART WINDOW ===== */

#chartWindow{

    display:none;

    position:fixed;

    top:10px;
    left:10px;
    right:10px;

    height:52vh;

    border-radius:18px;

    overflow:hidden;

    background:
    linear-gradient(#05070d,#05070d),

    repeating-linear-gradient(
        0deg,
        rgba(0,200,255,0.05) 0px,
        rgba(0,200,255,0.05) 1px,
        transparent 1px,
        transparent 30px
    ),

    repeating-linear-gradient(
        90deg,
        rgba(0,200,255,0.05) 0px,
        rgba(0,200,255,0.05) 1px,
        transparent 1px,
        transparent 30px
    );

    border:
    1px solid rgba(255,0,255,0.2);
}

/* ===== INFO ===== */

#infoWindow{

    display:none;

    position:fixed;

    bottom:10px;
    left:10px;
    right:10px;

    height:40vh;

    border-radius:18px;

    padding:20px;

    background:
    rgba(10,10,30,0.95);

    border:
    1px solid rgba(255,0,255,0.2);
}

.infoTitle{

    font-size:22px;

    color:#00c8ff;

    margin-bottom:12px;
}

.info{
    margin-top:8px;
    font-size:18px;
}

.green{
    color:#00c8ff;
}

.red{
    color:#ff2a6d;
}

/* ===== BUTTON ===== */

.back{

    margin-top:20px;

    padding:14px;

    border-radius:14px;

    background:
    rgba(20,20,40,0.8);

    border:
    1px solid rgba(255,0,255,0.2);

    text-align:center;

    cursor:pointer;
}

/* ===== CANVAS ===== */

canvas{
    display:block;
    width:100%;
    height:100%;
}

</style>
</head>

<body>

<!-- ===== MAIN ===== -->

<div id="main">

    <div class="title">
        CYBER SIGNALS
    </div>

    <div id="signals"></div>

</div>

<!-- ===== CHART ===== -->

<div id="chartWindow">

    <canvas id="chart"></canvas>

</div>

<!-- ===== INFO ===== -->

<div id="infoWindow">

    <div
    id="pair"
    class="infoTitle"
    ></div>

    <div
    id="direction"
    class="info"
    ></div>

    <div
    id="priceText"
    class="info"
    ></div>

    <div
    id="status"
    class="info"
    ></div>

    <div
    class="back"
    onclick="goBack()"
    >
        ← BACK
    </div>

</div>

<script>

// ===== ELEMENTS =====

const main=
document.getElementById("main")

const chartWindow=
document.getElementById("chartWindow")

const infoWindow=
document.getElementById("infoWindow")

const pair=
document.getElementById("pair")

const direction=
document.getElementById("direction")

const priceText=
document.getElementById("priceText")

const status=
document.getElementById("status")

// ===== SIGNALS =====

const signals=[

    {
        pair:"BTC/USDT",
        dir:"BUY"
    },

    {
        pair:"ETH/USDT",
        dir:"SELL"
    },

    {
        pair:"EUR/USD",
        dir:"BUY"
    }
]

// ===== RENDER =====

const signalsEl=
document.getElementById("signals")

signals.forEach((s,i)=>{

    const cls=
    s.dir==="BUY"
    ? "buy"
    : "sell"

    signalsEl.innerHTML+=`

    <div
    class="signal"
    onclick="openTrade(${i})"
    >

        <div style="font-size:20px">
            ${s.pair}
        </div>

        <div class="${cls}">
            ${s.dir}
        </div>

    </div>
    `
})

// ===== OPEN =====

let active=null

function openTrade(i){

    active=signals[i]

    pair.innerText=
    active.pair

    direction.innerHTML=
    `
    Signal:
    <span class="${
        active.dir==="BUY"
        ? "buy"
        : "sell"
    }">
        ${active.dir}
    </span>
    `

    main.style.display="none"

    chartWindow.style.display="block"

    infoWindow.style.display="block"

    resizeCanvas()

    startChart()
}

// ===== BACK =====

function goBack(){

    running=false

    chartWindow.style.display="none"

    infoWindow.style.display="none"

    main.style.display="block"
}

// ===== CANVAS =====

const canvas=
document.getElementById("chart")

const ctx=
canvas.getContext("2d")

function resizeCanvas(){

    canvas.width=
    chartWindow.clientWidth

    canvas.height=
    chartWindow.clientHeight
}

window.addEventListener(
    "resize",
    resizeCanvas
)

// ===== MARKET =====

let candles=[]

let current=null

let price=100

function newCandle(p){

    return{
        open:p,
        high:p,
        low:p,
        close:p
    }
}

// ===== HISTORY =====

function generate(){

    candles=[]

    let p=100

    for(let i=0;i<80;i++){

        let open=p

        let close=
        open+
        (Math.random()-0.5)*2

        candles.push({

            open,

            high:
            Math.max(open,close),

            low:
            Math.min(open,close),

            close
        })

        p=close
    }

    price=p

    current=
    newCandle(price)
}

// ===== LOOP =====

let running=false

function updatePrice(){

    let move=
    (Math.random()-0.5)*0.4

    price+=move

    current.high=
    Math.max(current.high,price)

    current.low=
    Math.min(current.low,price)

    current.close=price
}

// ===== NEW CANDLE =====

setInterval(()=>{

    if(!running)return

    candles.push(current)

    if(candles.length>100){

        candles.shift()
    }

    current=
    newCandle(price)

},2000)

// ===== DRAW =====

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    )

    const all=[
        ...candles,
        current
    ]

    const max=Math.max(
        ...all.map(c=>c.high)
    )

    const min=Math.min(
        ...all.map(c=>c.low)
    )

    const range=max-min || 1

    const w=14

    all.forEach((c,i)=>{

        const x=
        i*w+20

        const scale=
        canvas.height/range

        const o=
        canvas.height-
        (c.open-min)*scale

        const cl=
        canvas.height-
        (c.close-min)*scale

        const hi=
        canvas.height-
        (c.high-min)*scale

        const lo=
        canvas.height-
        (c.low-min)*scale

        const up=
        c.close>=c.open

        // wick

        ctx.strokeStyle=
        up
        ? "#00c8ff"
        : "#ff2a6d"

        ctx.lineWidth=1.2

        ctx.beginPath()

        ctx.moveTo(x+w/2,hi)

        ctx.lineTo(x+w/2,lo)

        ctx.stroke()

        // body

        ctx.fillStyle=
        up
        ? "#ff4dff"
        : "#ff2a6d"

        ctx.fillRect(

            x+w*0.2,

            Math.min(o,cl),

            w*0.6,

            Math.max(
                3,
                Math.abs(o-cl)
            )
        )
    })
}

// ===== ANIMATION =====

function animate(){

    if(!running)return

    updatePrice()

    priceText.innerHTML=
    `
    Price:
    <span class="green">
        ${price.toFixed(2)}
    </span>
    `

    const pnl=
    (price-100).toFixed(2)

    status.innerHTML=
    `
    P/L:
    <span class="${
        pnl>=0
        ? "green"
        : "red"
    }">
        ${pnl}
    </span>
    `

    draw()

    requestAnimationFrame(
        animate
    )
}

// ===== START =====

function startChart(){

    generate()

    running=true

    animate()
}

</script>

</body>
</html>
