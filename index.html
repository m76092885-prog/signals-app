<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#05070d;
    color:white;
    font-family:Arial;
}

/* ===== MAIN (СПИСОК) */
#main{
    padding:20px;
}

.title{
    font-size:22px;
    margin-bottom:10px;
}

.signal{
    background:#0f172a;
    border:1px solid #1f2937;
    padding:15px;
    border-radius:14px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
}

.signal:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px rgba(56,189,248,0.3);
}

/* ===== FLOAT WINDOWS */
.window{
    position:fixed;
    left:10px;
    right:10px;
    border-radius:18px;
    border:1px solid rgba(56,189,248,0.2);
    box-shadow:0 0 25px rgba(56,189,248,0.2);
    backdrop-filter:blur(10px);
}

/* график */
#chartWindow{
    top:10px;
    height:50vh;

    background:
    linear-gradient(#020617,#020617),
    repeating-linear-gradient(0deg,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 1px,
        transparent 1px,
        transparent 40px),
    repeating-linear-gradient(90deg,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 1px,
        transparent 1px,
        transparent 40px);
}

/* инфо */
#infoWindow{
    bottom:10px;
    height:40vh;
    padding:15px;
    background:#020617;
}

/* кнопка назад */
.back{
    padding:10px 14px;
    border-radius:10px;
    background:#111827;
    display:inline-block;
    cursor:pointer;
    margin-bottom:10px;
    transition:.2s;
}

.back:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px rgba(56,189,248,0.4);
}

.green{color:#00ff88}
.red{color:#ff3b3b}

canvas{
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<!-- ===== СПИСОК -->
<div id="main">
    <div class="title">Signals</div>
    <div id="signals"></div>
</div>

<!-- ===== ГРАФИК -->
<div id="chartWindow" class="window" style="display:none">
    <canvas id="chart"></canvas>
</div>

<!-- ===== ИНФО -->
<div id="infoWindow" class="window" style="display:none">

    <div class="back" onclick="goBack()">← Назад</div>

    <div id="pair"></div>
    <div id="timer"></div>
    <div id="profit"></div>

</div>

<script>

// ===== SIGNALS
let signals = [
    {pair:"EUR/USD", direction:"BUY", time:30},
    {pair:"GBP/USD", direction:"SELL", time:30},
    {pair:"USD/JPY", direction:"BUY", time:30},
]

// ===== RENDER
function renderSignals(){
    let box = document.getElementById("signals")
    box.innerHTML=""

    signals.forEach((s,i)=>{
        let c = s.direction==="BUY" ? "#00ff88" : "#ff3b3b"

        box.innerHTML += `
        <div class="signal" onclick="openTrade(${i})">
            <b>${s.pair}</b><br>
            <span style="color:${c}">${s.direction}</span>
        </div>`
    })
}

renderSignals()

// ===== NAV
let active=null

function openTrade(i){

    active = signals[i]

    document.getElementById("main").style.display="none"
    document.getElementById("chartWindow").style.display="block"
    document.getElementById("infoWindow").style.display="block"

    document.getElementById("pair").innerText =
        active.pair + " | " + active.direction

    start()
}

function goBack(){

    running = false

    document.getElementById("chartWindow").style.display="none"
    document.getElementById("infoWindow").style.display="none"
    document.getElementById("main").style.display="block"
}

// ===== GRAPH
const canvas = document.getElementById("chart")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight * 0.5

let candles=[]
let current=null
let price=100
let entry=0

function newCandle(p){
    return {open:p,high:p,low:p,close:p}
}

function generate(){
    candles=[]
    price=100

    for(let i=0;i<80;i++){
        let o=price
        let c=o+(Math.random()-0.5)*2
        let h=Math.max(o,c)+Math.random()
        let l=Math.min(o,c)-Math.random()

        candles.push({open:o,high:h,low:l,close:c})
        price=c
    }

    current=newCandle(price)
}

// ===== LOOP
let running=false
let last=0
let timer=0
let timeLeft=0

function loop(t){

    if(!running) return

    let dt = t-last
    last=t
    timer+=dt

    price += (Math.random()-0.5)*0.2

    current.high=Math.max(current.high,price)
    current.low=Math.min(current.low,price)
    current.close=price

    if(timer>2000){
        candles.push(current)
        if(candles.length>100) candles.shift()
        current=newCandle(price)
        timer=0
    }

    draw()

    timeLeft -= dt/1000

    let profit = price-entry

    document.getElementById("timer").innerText =
        "Time: "+Math.max(0,Math.floor(timeLeft))

    document.getElementById("profit").innerText =
        "P/L: "+profit.toFixed(2)

    document.getElementById("profit").className =
        profit>=0 ? "green" : "red"

    requestAnimationFrame(loop)
}

// ===== DRAW (центр)
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height)

    let all=[...candles,current]

    let max=Math.max(...all.map(c=>c.high))
    let min=Math.min(...all.map(c=>c.low))
    let range=max-min || 1

    let center = Math.floor(all.length/2)
    let w = canvas.width/20

    all.forEach((c,i)=>{

        let x = (i-center)*w + canvas.width/2

        let scale=canvas.height/range

        let o=canvas.height-(c.open-min)*scale
        let cl=canvas.height-(c.close-min)*scale
        let hi=canvas.height-(c.high-min)*scale
        let lo=canvas.height-(c.low-min)*scale

        let up=c.close>c.open

        ctx.strokeStyle=up?"#00ff88":"#ff3b3b"
        ctx.lineWidth=2

        ctx.beginPath()
        ctx.moveTo(x+w/2,hi)
        ctx.lineTo(x+w/2,lo)
        ctx.stroke()

        ctx.fillStyle=up?"#00ff88":"#ff3b3b"

        ctx.shadowColor=up?"#00ff88":"#ff3b3b"
        ctx.shadowBlur=10

        ctx.fillRect(
            x+w*0.2,
            Math.min(o,cl),
            w*0.6,
            Math.abs(o-cl)||2
        )

        ctx.shadowBlur=0
    })
}

// ===== START
function start(){

    generate()
    entry=price
    timeLeft=active.time

    running=true
    last=performance.now()

    requestAnimationFrame(loop)
}

</script>

</body>
</html>
