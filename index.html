<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CYBER SIGNALS</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{

    font-family:monospace;

    overflow:hidden;

    color:white;

    background:
    radial-gradient(circle at top,
    #1b1030 0%,
    #090913 50%,
    #030308 100%);
}

/* ===== MAIN ===== */

#main{

    width:100%;
    height:100vh;

    overflow-y:auto;

    padding:20px;
}

/* ===== TITLE ===== */

.title{

    font-size:32px;

    font-weight:bold;

    margin-bottom:24px;

    color:#ff4dff;

    text-shadow:
    0 0 10px #ff4dff,
    0 0 30px #ff4dff;
}

/* ===== STATS ===== */

.stats{

    display:flex;

    gap:12px;

    margin-bottom:20px;
}

.card{

    flex:1;

    background:
    rgba(20,20,40,0.72);

    border:
    1px solid rgba(255,0,255,0.18);

    border-radius:18px;

    padding:16px;

    backdrop-filter:blur(14px);

    box-shadow:
    0 0 25px rgba(255,0,255,0.08);
}

.cardTitle{

    color:#7dd3fc;

    margin-bottom:10px;

    font-size:14px;
}

.cardValue{

    font-size:24px;

    color:#fff;
}

/* ===== SIGNAL ===== */

.signal{

    background:
    rgba(20,20,40,0.72);

    border:
    1px solid rgba(255,0,255,0.18);

    border-radius:20px;

    padding:18px;

    margin-bottom:16px;

    transition:0.22s;

    backdrop-filter:blur(14px);

    cursor:pointer;

    box-shadow:
    0 0 20px rgba(255,0,255,0.06);
}

.signal:active{

    transform:scale(0.98);
}

.signal:hover{

    transform:scale(1.02);

    box-shadow:
    0 0 30px rgba(255,0,255,0.2);
}

.pair{

    font-size:22px;

    margin-bottom:8px;
}

.buy{

    color:#00d0ff;

    text-shadow:
    0 0 12px #00d0ff;
}

.sell{

    color:#ff4d8d;

    text-shadow:
    0 0 12px #ff4d8d;
}

.small{

    color:#9ca3af;

    margin-top:6px;

    font-size:13px;
}

/* ===== TRADE SCREEN ===== */

#trade{

    display:none;

    width:100%;
    height:100vh;
}

/* ===== CHART WINDOW ===== */

#chartWrap{

    position:fixed;

    top:12px;
    left:12px;
    right:12px;

    height:52vh;

    border-radius:24px;

    overflow:hidden;

    background:

    linear-gradient(#05070d,#05070d),

    repeating-linear-gradient(
        0deg,
        rgba(0,200,255,0.05) 0px,
        rgba(0,200,255,0.05) 1px,
        transparent 1px,
        transparent 34px
    ),

    repeating-linear-gradient(
        90deg,
        rgba(0,200,255,0.05) 0px,
        rgba(0,200,255,0.05) 1px,
        transparent 1px,
        transparent 34px
    );

    border:
    1px solid rgba(255,0,255,0.18);

    box-shadow:
    0 0 40px rgba(255,0,255,0.12);

    display:flex;

    justify-content:center;

    align-items:center;
}

#chart{

    width:92%;

    height:88%;
}

/* ===== INFO ===== */

#info{

    position:fixed;

    bottom:12px;
    left:12px;
    right:12px;

    height:40vh;

    border-radius:24px;

    padding:20px;

    background:
    rgba(15,15,30,0.92);

    border:
    1px solid rgba(255,0,255,0.18);

    backdrop-filter:blur(16px);

    box-shadow:
    0 0 40px rgba(255,0,255,0.08);
}

.infoTitle{

    font-size:26px;

    margin-bottom:14px;

    color:#00d0ff;

    text-shadow:
    0 0 12px #00d0ff;
}

.line{

    margin-top:10px;

    font-size:18px;
}

.green{

    color:#00d0ff;
}

.red{

    color:#ff4d8d;
}

/* ===== BACK ===== */

.back{

    margin-top:24px;

    padding:14px;

    border-radius:16px;

    text-align:center;

    background:
    rgba(20,20,40,0.8);

    border:
    1px solid rgba(255,0,255,0.18);

    transition:0.2s;

    cursor:pointer;
}

.back:hover{

    transform:scale(1.02);

    box-shadow:
    0 0 20px rgba(255,0,255,0.2);
}

</style>
</head>

<body>

<!-- ===== MAIN ===== -->

<div id="main">

    <div class="title">
        CYBER SIGNALS
    </div>

    <div class="stats">

        <div class="card">

            <div class="cardTitle">
                WINRATE
            </div>

            <div class="cardValue">
                87%
            </div>

        </div>

        <div class="card">

            <div class="cardTitle">
                SIGNALS
            </div>

            <div class="cardValue">
                24
            </div>

        </div>

    </div>

    <div
    class="signal"
    onclick="openTrade('BTCUSDT','BUY')"
    >

        <div class="pair">
            BTC / USDT
        </div>

        <div class="buy">
            BUY
        </div>

        <div class="small">
            1m • Strong Trend
        </div>

    </div>

    <div
    class="signal"
    onclick="openTrade('ETHUSDT','SELL')"
    >

        <div class="pair">
            ETH / USDT
        </div>

        <div class="sell">
            SELL
        </div>

        <div class="small">
            1m • Resistance Zone
        </div>

    </div>

    <div
    class="signal"
    onclick="openTrade('BNBUSDT','BUY')"
    >

        <div class="pair">
            BNB / USDT
        </div>

        <div class="buy">
            BUY
        </div>

        <div class="small">
            1m • Momentum Entry
        </div>

    </div>

</div>

<!-- ===== TRADE ===== -->

<div id="trade">

    <div id="chartWrap">

        <div id="chart"></div>

    </div>

    <div id="info">

        <div
        id="pairName"
        class="infoTitle"
        ></div>

        <div
        id="signalType"
        class="line"
        ></div>

        <div
        id="price"
        class="line"
        ></div>

        <div
        id="profit"
        class="line"
        ></div>

        <div
        class="back"
        onclick="backToSignals()"
        >
            ← BACK TO SIGNALS
        </div>

    </div>

</div>

<script>

// ===== ELEMENTS =====

const main=
document.getElementById("main")

const trade=
document.getElementById("trade")

const pairName=
document.getElementById("pairName")

const signalType=
document.getElementById("signalType")

const priceEl=
document.getElementById("price")

const profitEl=
document.getElementById("profit")

// ===== CHART =====

let chart
let candleSeries
let ws

// ===== OPEN TRADE =====

function openTrade(symbol,side){

    main.style.display="none"

    trade.style.display="block"

    pairName.innerText=symbol

    signalType.innerHTML=
    `
    Signal:
    <span class="${
        side==="BUY"
        ? "buy"
        : "sell"
    }">
        ${side}
    </span>
    `

    createChart()

    connect(symbol)
}

// ===== BACK =====

function backToSignals(){

    trade.style.display="none"

    main.style.display="block"

    if(ws){

        ws.close()
    }

    if(chart){

        chart.remove()
    }
}

// ===== CREATE CHART =====

function createChart(){

    const container=
    document.getElementById("chart")

    container.innerHTML=""

    chart=
    LightweightCharts.createChart(

        container,

        {

            width:
            container.clientWidth,

            height:
            container.clientHeight,

            layout:{

                background:{
                    color:"#05070d"
                },

                textColor:"#777"
            },

            grid:{

                vertLines:{
                    color:
                    "rgba(0,200,255,0.05)"
                },

                horzLines:{
                    color:
                    "rgba(0,200,255,0.05)"
                }
            },

            rightPriceScale:{
                borderColor:"#222"
            },

            timeScale:{

                borderColor:"#222",

                timeVisible:true,

                rightOffset:18,

                barSpacing:12
            }
        }
    )

    candleSeries=
    chart.addSeries(

        LightweightCharts.CandlestickSeries,

        {

            upColor:"#00d0ff",

            downColor:"#ff4d8d",

            wickUpColor:"#00d0ff",

            wickDownColor:"#ff4d8d",

            borderVisible:false
        }
    )
}

// ===== REALTIME =====

function connect(symbol){

    ws=new WebSocket(
    "wss://stream.bybit.com/v5/public/linear"
    )

    ws.onopen=()=>{

        ws.send(JSON.stringify({

            op:"subscribe",

            args:[
                `kline.1.${symbol}`
            ]
        }))
    }

    ws.onmessage=(e)=>{

        const msg=
        JSON.parse(e.data)

        if(!msg.data)return

        const k=
        msg.data[0]

        candleSeries.update({

            time:
            Math.floor(k.start/1000),

            open:
            parseFloat(k.open),

            high:
            parseFloat(k.high),

            low:
            parseFloat(k.low),

            close:
            parseFloat(k.close)
        })

        chart.timeScale().scrollToRealtime()

        priceEl.innerHTML=
        `
        Price:
        <span class="green">
            ${k.close}
        </span>
        `

        const pnl=
        (
            parseFloat(k.close)-
            parseFloat(k.open)
        ).toFixed(2)

        profitEl.innerHTML=
        `
        PNL:
        <span class="${
            pnl>=0
            ? "green"
            : "red"
        }">
            ${pnl}
        </span>
        `
    }
}

</script>

</body>
</html>
