<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#020617;
    color:#fff;
    font-family:Arial;
    overflow:hidden;
}

/* ФОН */
#bg{
    position:fixed;
    width:100%;
    height:100%;
    filter:blur(10px) brightness(0.6);
    z-index:0;
}

/* СПИСОК */
.container{
    position:relative;
    z-index:2;
    padding:15px;
    height:100vh;
    overflow:auto;
}

.signal{
    background:rgba(17,24,39,0.85);
    margin-bottom:10px;
    padding:16px;
    border-radius:18px;
    backdrop-filter:blur(6px);
}

/* СДЕЛКА */
.trade{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#020617;
    display:none;
    flex-direction:column;
    z-index:10;
}

#chart{
    height:60%;
}

.info{
    padding:15px;
}

.btn{
    margin-top:10px;
    padding:14px;
    background:#1e293b;
    border-radius:20px;
    text-align:center;
}
</style>

</head>

<body>

<canvas id="bg"></canvas>

<div class="container" id="signals"></div>

<div class="trade" id="trade">
    <canvas id="chart"></canvas>

```
<div class="info">
    <div id="pair"></div>
    <div id="status"></div>
    <div id="timer"></div>
    <div id="reason"></div>

    <div class="btn" onclick="closeTrade()">Назад</div>
</div>
```

</div>

<script>

// ===== ФОН СВЕЧИ =====
const bg = document.getElementById("bg")
const bctx = bg.getContext("2d")

bg.width = window.innerWidth
bg.height = window.innerHeight

let bgCandles = []

function newCandle(prev){
    let open = prev ? prev.close : 100
    let close = open + (Math.random()-0.5)*2
    let high = Math.max(open,close) + Math.random()
    let low = Math.min(open,close) - Math.random()
    return {open,close,high,low}
}

for(let i=0;i<60;i++){
    bgCandles.push(newCandle(bgCandles[i-1]))
}

function drawBG(){

    bctx.clearRect(0,0,bg.width,bg.height)

    bgCandles.push(newCandle(bgCandles[bgCandles.length-1]))
    bgCandles.shift()

    let w = bg.width / bgCandles.length

    bgCandles.forEach((c,i)=>{

        let x = i*w
        let mid = bg.height/2

        let scale = 5

        let o = mid - (c.open-100)*scale
        let cl = mid - (c.close-100)*scale
        let h = mid - (c.high-100)*scale
        let l = mid - (c.low-100)*scale

        // тень
        bctx.strokeStyle = "rgba(255,255,255,0.2)"
        bctx.beginPath()
        bctx.moveTo(x+w/2,h)
        bctx.lineTo(x+w/2,l)
        bctx.stroke()

        // тело
        bctx.fillStyle = c.close > c.open
            ? "rgba(34,197,94,0.4)"
            : "rgba(239,68,68,0.4)"

        let y = Math.min(o,cl)
        let height = Math.abs(o-cl)

        bctx.fillRect(x, y, w*0.7, height || 1)
    })
}

setInterval(drawBG,120)

// ===== СИГНАЛЫ =====
let signalsData=[]

async function load(){
    let res = await fetch("/signals")
    signalsData = await res.json()

    let c = document.getElementById("signals")
    c.innerHTML=""

    signalsData.forEach(s=>{
        let div = document.createElement("div")
        div.className="signal"

        div.innerHTML = `
            <b>${s.symbol}</b><br>
            ${s.signal} (${s.probability}%)
        `

        div.onclick = ()=> openTrade(s)

        c.appendChild(div)
    })
}

setInterval(load,3000)
load()

// ===== СДЕЛКА =====
const canvas = document.getElementById("chart")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight * 0.6

let trade = null
let candles = []

function openTrade(s){
    trade = s
    document.getElementById("trade").style.display="flex"

    document.getElementById("pair").innerText =
        s.symbol + " | " + s.signal

    document.getElementById("reason").innerText =
        "RSI + тренд + импульс"

    startTrade()
}

function closeTrade(){
    document.getElementById("trade").style.display="none"
}

// ===== СВЕЧНОЙ ГРАФИК =====
function startTrade(){

    candles=[]

    for(let i=0;i<50;i++){
        candles.push(newCandle(candles[i-1]))
    }

    let entry = candles[candles.length-1].close
    let start = Date.now()

    function animate(){

        ctx.clearRect(0,0,canvas.width,canvas.height)

        candles.push(newCandle(candles[candles.length-1]))
        if(candles.length > 80) candles.shift()

        let w = canvas.width / candles.length

        candles.forEach((c,i)=>{

            let x = i*w
            let mid = canvas.height/2

            let scale = 15

            let o = mid - (c.open-entry)*scale
            let cl = mid - (c.close-entry)*scale
            let h = mid - (c.high-entry)*scale
            let l = mid - (c.low-entry)*scale

            // тень
            ctx.strokeStyle = "#888"
            ctx.beginPath()
            ctx.moveTo(x+w/2,h)
            ctx.lineTo(x+w/2,l)
            ctx.stroke()

            // тело
            ctx.fillStyle = c.close > c.open
                ? "#22c55e"
                : "#ef4444"

            let y = Math.min(o,cl)
            let height = Math.abs(o-cl)

            ctx.fillRect(x, y, w*0.7, height || 1)
        })

        // линия входа
        ctx.strokeStyle="#fff"
        ctx.beginPath()
        ctx.moveTo(0,canvas.height/2)
        ctx.lineTo(canvas.width,canvas.height/2)
        ctx.stroke()

        let last = candles[candles.length-1].close

        let profit =
            (trade.signal=="BUY" && last > entry) ||
            (trade.signal=="SELL" && last < entry)

        document.getElementById("status").innerText =
            profit ? "🟢 В профите" : "🔴 В минусе"

        let left = 60 - (Date.now()-start)/1000
        document.getElementById("timer").innerText =
            "⏱ " + left.toFixed(1) + " сек"

        if(left > 0){
            requestAnimationFrame(animate)
        }
    }

    animate()
}

</script>

</body>
</html>
