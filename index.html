<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
AI Futures Sniper
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    Inter,
    Arial,
    sans-serif;
}

body{

    background:
    radial-gradient(
        circle at top,
        #1a0f2e,
        #090014 45%,
        #020005 100%
    );

    color:white;

    width:100vw;
    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;
}

.screen{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    padding:20px;

    overflow-y:auto;
}

.active{
    display:flex;
}

.panel{

    width:min(92vw,430px);

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,0,180,0.12);

    backdrop-filter:
    blur(30px);

    border-radius:34px;

    padding:34px;

    box-shadow:

    0 0 35px rgba(255,0,180,0.10);
}

.logo{

    font-size:34px;

    text-align:center;

    font-weight:900;

    color:#ff4fd8;

    margin-bottom:22px;
}

.subtitle{

    text-align:center;

    opacity:0.7;

    line-height:1.7;

    margin-bottom:36px;

    font-size:15px;
}

.btn{

    width:100%;

    padding:18px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        90deg,
        #ff4fd8,
        #7a5cff
    );

    color:white;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:
    0.18s ease;

    margin-top:18px;
}

.btn:active{

    transform:
    scale(0.96);
}

.select{

    width:100%;

    padding:18px;

    margin-top:18px;

    border:none;

    border-radius:18px;

    background:
    rgba(255,255,255,0.05);

    color:white;

    font-size:16px;

    outline:none;
}

.option{

    display:flex;

    align-items:center;

    gap:14px;

    margin-top:25px;

    cursor:pointer;
}

.option input{

    appearance:none;

    width:22px;
    height:22px;

    border-radius:50%;

    border:
    2px solid rgba(255,255,255,0.55);

    background:
    rgba(255,255,255,0.05);

    transition:0.2s;
}

.option input:checked{

    background:
    linear-gradient(
        135deg,
        #ff4fd8,
        #8b5cff
    );

    border:
    2px solid #ff8ef2;
}

.backBtn{

    display:block;

    margin:

    34px auto 0 auto;

    width:100px;

    padding:10px;

    border:none;

    border-radius:16px;

    background:
    rgba(255,255,255,0.04);

    color:
    rgba(255,255,255,0.35);

    font-size:12px;

    cursor:pointer;
}

.radar{

    width:210px;
    height:210px;

    border-radius:50%;

    border:
    5px solid #ff4fd8;

    animation:
    spin 3s linear infinite;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.scanText{

    margin-top:40px;

    font-size:30px;

    color:#ff4fd8;
}

.signalBox{

    width:min(92vw,520px);

    background:
    rgba(255,255,255,0.05);

    border-radius:34px;

    padding:32px;
}

.signalTitle{

    font-size:38px;

    color:#ff4fd8;

    margin-bottom:18px;

    font-weight:900;
}

.signalSide{

    font-size:32px;

    font-weight:900;

    margin-bottom:25px;
}

.buy{
    color:#00ff9d;
}

.sell{
    color:#ff5c7c;
}

.metric{

    margin-top:16px;

    font-size:20px;
}

.confidence{

    margin-top:30px;

    font-size:46px;

    color:#ff4fd8;

    font-weight:900;
}

.reasonBox{

    margin-top:30px;

    padding:22px;

    border-radius:24px;

    background:
    rgba(255,255,255,0.04);
}

.reason{

    margin-top:12px;
}

</style>

</head>

<body>

<div class="screen active"
id="homeScreen">

    <div class="panel">

        <div class="logo">

            AI FUTURES SNIPER

        </div>

        <div class="subtitle">

            The Most Powerful AI Futures Trading System

        </div>

        <button class="btn"
        onclick="show('settingsScreen')">

            GET SIGNAL

        </button>

    </div>

</div>

<div class="screen"
id="settingsScreen">

    <div class="panel">

        <div class="logo">

            SIGNAL SETTINGS

        </div>

        <select class="select"
        id="asset">

            <option>

                CC1!

            </option>

        </select>

        <select class="select"
        id="timeframe">

            <option value="3m">

                3 MIN

            </option>

            <option value="5m">

                5 MIN

            </option>

            <option value="15m">

                15 MIN

            </option>

        </select>

        <div class="option">

            <input type="checkbox"
            id="trendOnly">

            <label for="trendOnly">

                ONLY TREND TRADES

            </label>

        </div>

        <button class="btn"
        onclick="startScan()">

            START AI SCAN

        </button>

        <button class="backBtn"
        onclick="show('homeScreen')">

            BACK

        </button>

    </div>

</div>

<div class="screen"
id="scanScreen">

    <div class="radar"></div>

    <div class="scanText">

        SEARCHING SIGNAL...

    </div>

</div>

<div class="screen"
id="signalScreen">

    <div class="signalBox">

        <div class="signalTitle">

            ELITE ENTRY

        </div>

        <div class="signalSide"
        id="side">

            BUY

        </div>

        <div class="metric"
        id="assetText">

            ASSET: CC1!

        </div>

        <div class="metric"
        id="entry">

            ENTRY: 0

        </div>

        <div class="metric"
        id="sl">

            SL: 0

        </div>

        <div class="metric"
        id="tp">

            TP1: 0 | TP2: 0

        </div>

        <div class="confidence"
        id="confidence">

            84%

        </div>

        <div class="reasonBox"
        id="reasons">

        </div>

        <button class="backBtn"
        onclick="show('homeScreen')">

            BACK

        </button>

    </div>

</div>

<script>

const API =
"https://signals-ai-engine.onrender.com"

function show(id){

    document
    .querySelectorAll(".screen")
    .forEach(s =>

        s.classList.remove("active")

    )

    document
    .getElementById(id)
    .classList.add("active")
}

async function startScan(){

    show("scanScreen")

    const asset =
    document
    .getElementById("asset")
    .value

    const timeframe =
    document
    .getElementById("timeframe")
    .value

    const trendOnly =
    document
    .getElementById("trendOnly")
    .checked

    try{

        const response =
        await fetch(

            `${API}/signal?asset=${asset}&timeframe=${timeframe}&trend_only=${trendOnly}`

        )

        const data =
        await response.json()

        if(data.status === "NO SIGNAL"){

            alert("NO SIGNAL FOUND YET")

            show("settingsScreen")

            return
        }

        if(data.error){

            alert(data.error)

            show("settingsScreen")

            return
        }

        showSignal(data)

    }catch(err){

        alert("Backend connection error")

        show("settingsScreen")
    }
}

function showSignal(data){

    show("signalScreen")

    const side =
    document
    .getElementById("side")

    side.innerText =
    data.side

    side.className =
    "signalSide " +

    (
        data.side === "BUY"
        ? "buy"
        : "sell"
    )

    document
    .getElementById("assetText")
    .innerText =

    "ASSET: " +

    data.asset

    document
    .getElementById("entry")
    .innerText =

    "ENTRY: " +

    data.entry

    document
    .getElementById("sl")
    .innerText =

    "SL: " +

    data.sl

    document
    .getElementById("tp")
    .innerText =

    "TP1: " +

    data.tp1 +

    " | TP2: " +

    data.tp2

    document
    .getElementById("confidence")
    .innerText =

    data.confidence +

    "% SUCCESS"

    const reasons =
    document
    .getElementById("reasons")

    reasons.innerHTML = ""

    data.reasons.forEach(r => {

        reasons.innerHTML +=

        `<div class="reason">

            • ${r}

        </div>`
    })
}

</script>

</body>

</html>
