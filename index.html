<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cyber Signals</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{

    background:
    radial-gradient(circle at top,
    #111827 0%,
    #05070d 60%,
    #020308 100%);

    color:white;

    font-family:monospace;

    overflow:hidden;
}

/* ===== MAIN ===== */

#main{

    width:100%;
    height:100vh;

    overflow-y:auto;

    padding:20px;
}

/* ===== TITLE ===== */

.title{

    color:#ff4dff;

    font-size:28px;

    margin-bottom:20px;

    text-shadow:
    0 0 10px #ff4dff,
    0 0 25px #ff4dff;
}

/* ===== SIGNAL ===== */

.signal{

    background:
    rgba(20,20,40,0.78);

    border:
    1px solid rgba(255,0,255,0.2);

    border-radius:18px;

    padding:18px;

    margin-bottom:14px;

    transition:0.22s;

    cursor:pointer;

    backdrop-filter:blur(12px);
}

.signal:hover{

    transform:scale(1.02);

    box-shadow:
    0 0 20px rgba(255,0,255,0.35),
    0 0 40px rgba(0,200,255,0.08);
}

.signalPair{

    font-size:20px;

    margin-bottom:8px;
}

.buy{

    color:#ff4dff;

    text-shadow:
    0 0 10px #ff4dff;
}

.sell{

    color:#ff2a6d;

    text-shadow:
    0 0 10px #ff2a6d;
}

/* ===== TRADE SCREEN ===== */

#tradeScreen{

    display:none;

    width:100%;
    height:100vh;
}

/* ===== CHART ===== */

#chartBox{

    position:fixed;

    top:10px;
    left:10px;
    right:10px;

    height:52vh;

    border-radius:20px;

    overflow:hidden;

    background:
    linear-gradient(#05070d,#05070d),

    repeating-linear-gradient(
        0deg,
        rgba(0,200,255,0.05) 0px,
        rgba(0,200,255,0.05) 1px,
        transparent 1px,
        transparent 32px
    ),

    repeating-linear-gradient(
        90deg,
        rgba(0,200,255,0.05) 0px,
        rgba(0,200,255,0.05) 1px,
        transparent 1px,
        transparent 32px
    );

    border:
    1px solid rgba(255,0,255,0.2);

    box-shadow:
    0 0 25px rgba(255,0,255,0.15);
}

/* ===== INFO ===== */

#infoBox{

    position:fixed;

    bottom:10px;
    left:10px;
    right:10px;

    height:40vh;

    border-radius:20px;

    padding:20px;

    background:
    rgba(10,10,30,0.95);

    border:
    1px solid rgba(255,0,255,0.2);

    backdrop-filter:blur(15px);

    box-shadow:
    0 0 25px rgba(255,0,255,0.12);
}

.infoTitle{

    font-size:24px;

    margin-bottom:12px;

    color:#00c8ff;

    text-shadow:
    0 0 10px #00c8ff;
}

.info{

    margin-top:10px;

    font-size:18px;
}

.green{

    color:#00c8ff;

    text-shadow:
    0 0 10px #00c8ff;
}

.red{

    color:#ff2a6d;

    text-shadow:
    0 0 10px #ff2a6d;
}

/* ===== BACK ===== */

.back{

    margin-top:22px;

    padding:14px;

    text-align:center;

    border-radius:14px;

    background:
    rgba(20,20,40,0.8);

    border:
    1px solid rgba(255,0,255,0.2);

    cursor:pointer;

    transition:0.22s;
}

.back:hover{

    transform:scale(1.02);

    box-shadow:
    0 0 20px rgba(255,0,255,0.4);
}

</style>
</head>

<body>

<!-- ===== MAIN ===== -->

<div id="main">

    <div class="title">
        CYBER SIGNALS
    </div>

    <div
    class="signal"
    onclick="openTrade('btcusdt','BUY')"
    >
        <div class="signalPair">
            BTC/USDT
        </div>

        <div class="buy">
            BUY
        </div>
    </div>

    <div
    class="signal"
    onclick="openTrade('ethusdt','SELL')"
    >
        <div class="signalPair">
            ETH/USDT
        </div>

        <div class="sell">
            SELL
        </div>
    </div>

    <div
    class="signal"
    onclick="openTrade('bnbusdt','BUY')"
    >
        <div class="signalPair">
            BNB/USDT
        </div>

        <div class="buy">
            BUY
        </div>
    </div>

</div>

<!-- ===== TRADE SCREEN ===== -->

<div id="tradeScreen">

    <div id="chartBox"></div>

    <div id="infoBox">

        <div
        id="pair"
        class="infoTitle"
        ></div>

        <div
        id="signalText"
        class="info"
        ></div>

        <div
        id="priceText"
        class="info"
        ></div>

        <div
        id="statusText"
        class="info"
        ></div>

        <div
        class="back"
        onclick="goBack()"
        >
            ← BACK
        </div>

    </div>

</div>

<script>

// ===== UI =====

const main=
document.getElementById("main")

const tradeScreen=
document.getElementById("tradeScreen")

const pairEl=
document.getElementById("pair")

const signalText=
document.getElementById("signalText")

const priceText=
document.getElementById("priceText")

const statusText=
document.getElementById("statusText")

// ===== CHART =====

let chart=null

let candleSeries=null

let ws=null

// ===== OPEN =====

function openTrade(symbol,dir){

    main.style.display="none"

    tradeScreen.style.display="block"

    pairEl.innerText=
    symbol.toUpperCase()

    signalText.innerHTML=
    `
    Signal:
    <span class="${
        dir==="BUY"
        ? "buy"
        : "sell"
    }">
        ${dir}
    </span>
    `

    createChart()

    connectBinance(symbol)
}

// ===== BACK =====

function goBack(){

    tradeScreen.style.display="none"

    main.style.display="block"

    if(ws){

        ws.close()

        ws=null
    }

    if(chart){

        chart.remove()

        chart=null
    }
}

// ===== CREATE CHART =====

function createChart(){

    const chartBox=
    document.getElementById(
        "chartBox"
    )

    chartBox.innerHTML=""

    chart=
    LightweightCharts.createChart(

        chartBox,

        {

            width:
            chartBox.clientWidth,

            height:
            chartBox.clientHeight,

            layout:{

                background:{
                    color:"#05070d"
                },

                textColor:"#777"
            },

            grid:{

                vertLines:{
                    color:
                    "rgba(0,200,255,0.05)"
                },

                horzLines:{
                    color:
                    "rgba(0,200,255,0.05)"
                }
            },

            rightPriceScale:{
                borderColor:"#222"
            },

            timeScale:{
                borderColor:"#222",

                timeVisible:true
            },

            crosshair:{
                mode:1
            }
        }
    )

    // ===== FIXED NEW API =====

    candleSeries=
    chart.addSeries(

        LightweightCharts.CandlestickSeries,

        {

            upColor:"#ff4dff",

            downColor:"#ff2a6d",

            wickUpColor:"#00c8ff",

            wickDownColor:"#ff2a6d",

            borderVisible:false
        }
    )
}

// ===== REALTIME =====

function connectBinance(symbol){

    ws=new WebSocket(

    `wss://stream.binance.com:9443/ws/${symbol}@kline_1m`

    )

    ws.onmessage=(event)=>{

        const msg=
        JSON.parse(event.data)

        const k=msg.k

        candleSeries.update({

            time:
            Math.floor(k.t/1000),

            open:
            parseFloat(k.o),

            high:
            parseFloat(k.h),

            low:
            parseFloat(k.l),

            close:
            parseFloat(k.c)
        })

        priceText.innerHTML=
        `
        Price:
        <span class="green">
            ${k.c}
        </span>
        `

        const move=
        (
            parseFloat(k.c)-
            parseFloat(k.o)
        ).toFixed(2)

        statusText.innerHTML=
        `
        Candle:
        <span class="${
            move>=0
            ? "green"
            : "red"
        }">
            ${move}
        </span>
        `
    }

    ws.onerror=()=>{

        statusText.innerHTML=
        `
        <span class="red">
            WebSocket Error
        </span>
        `
    }
}

// ===== RESIZE =====

window.addEventListener(
    "resize",
    ()=>{

        if(chart){

            chart.applyOptions({

                width:
                document.getElementById(
                    "chartBox"
                ).clientWidth,

                height:
                document.getElementById(
                    "chartBox"
                ).clientHeight
            })
        }
    }
)

</script>

</body>
</html>
