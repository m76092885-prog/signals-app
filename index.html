<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#05070d;
    color:white;
    font-family:Arial;
}

#main{ padding:20px; transition:.2s; }
.title{ font-size:24px; margin-bottom:10px; }
.winrate{ margin-bottom:15px; color:#38bdf8; }

.signal{
    position:relative;
    overflow:hidden;
    background:linear-gradient(145deg,#0f172a,#020617);
    border:1px solid #1f2937;
    padding:16px;
    border-radius:16px;
    margin-bottom:12px;
    cursor:pointer;
    transition:.2s;
}

.signal:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px rgba(56,189,248,.25);
}

.signal:active{
    transform:scale(.97);
}

#trade{
    display:none;
    height:100vh;
    flex-direction:column;
}

.chart-box{ height:60%; }
.info-box{ padding:15px; }

.back{
    padding:10px 16px;
    border-radius:12px;
    background:#111827;
    display:inline-block;
    cursor:pointer;
    margin-bottom:10px;
}

.green{ color:#00ff88 }
.red{ color:#ff3b3b }

canvas{ width:100%; height:100%; }

</style>
</head>

<body>

<div id="main">
    <div class="title">Signals</div>
    <div class="winrate">Winrate: <span id="wr">0%</span></div>
    <div id="signals"></div>
</div>

<div id="trade">
    <div class="chart-box">
        <canvas id="chart"></canvas>
    </div>
    <div class="info-box">
        <div class="back" onclick="back()">← Назад</div>
        <div id="pair"></div>
        <div id="timer"></div>
        <div id="profit"></div>
    </div>
</div>

<script>

// ===== DATA
let signals = [
    {pair:"EUR/USD", direction:"BUY", time:30},
    {pair:"GBP/USD", direction:"SELL", time:30}
]

function renderSignals(){
    let box = document.getElementById("signals")
    box.innerHTML = ""

    signals.forEach((s,i)=>{
        let c = s.direction==="BUY"?"#00ff88":"#ff3b3b"

        box.innerHTML += `
        <div class="signal" onclick="openTrade(${i})">
            ${s.pair}<br>
            <span style="color:${c}">${s.direction}</span>
        </div>`
    })
}

renderSignals()

// ===== NAV
let active = null

function openTrade(i){
    active = signals[i]

    document.getElementById("main").style.display="none"
    document.getElementById("trade").style.display="flex"

    document.getElementById("pair").innerText =
        active.pair+" | "+active.direction

    startTrade()
}

function back(){
    running = false
    document.getElementById("trade").style.display="none"
    document.getElementById("main").style.display="block"
}

// ===== GRAPH ENGINE (FIXED)
const canvas = document.getElementById("chart")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight*0.6

let candles=[]
let current=null
let price=100
let entry=0

function newCandle(p){
    return {open:p,high:p,low:p,close:p}
}

function generate(){
    candles=[]
    price=100

    for(let i=0;i<40;i++){
        let o=price
        let c=o+(Math.random()-0.5)*2
        let h=Math.max(o,c)+Math.random()
        let l=Math.min(o,c)-Math.random()

        candles.push({open:o,high:h,low:l,close:c})
        price=c
    }

    current=newCandle(price)
}

// ===== GAME LOOP
let running=false
let lastTime=0
let candleTimer=0
let timeLeft=0

function loop(t){

    if(!running) return

    let dt = t - lastTime
    lastTime = t

    candleTimer += dt

    // обновление цены
    price += (Math.random()-0.5)*0.2
    current.high = Math.max(current.high,price)
    current.low = Math.min(current.low,price)
    current.close = price

    // новая свеча каждые 2 сек
    if(candleTimer > 2000){
        candles.push(current)
        if(candles.length>60) candles.shift()
        current = newCandle(price)
        candleTimer = 0
    }

    draw()

    // таймер сделки
    timeLeft -= dt/1000

    let profit = price - entry

    document.getElementById("timer").innerText =
        "Time: "+Math.max(0,Math.floor(timeLeft))

    document.getElementById("profit").innerText =
        "P/L: "+profit.toFixed(2)

    requestAnimationFrame(loop)
}

// ===== DRAW (ЧЁТКИЙ)
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height)

    let all=[...candles,current].filter(Boolean)

    let max=Math.max(...all.map(c=>c.high))
    let min=Math.min(...all.map(c=>c.low))
    let range=max-min || 1

    let w=canvas.width/all.length

    all.forEach((c,i)=>{

        let x=i*w
        let scale=canvas.height/range

        let o=canvas.height-(c.open-min)*scale
        let cl=canvas.height-(c.close-min)*scale
        let hi=canvas.height-(c.high-min)*scale
        let lo=canvas.height-(c.low-min)*scale

        let up=c.close>c.open

        ctx.strokeStyle=up?"#00ff88":"#ff3b3b"
        ctx.lineWidth=2

        ctx.beginPath()
        ctx.moveTo(x+w/2,hi)
        ctx.lineTo(x+w/2,lo)
        ctx.stroke()

        ctx.fillStyle=up?"#00ff88":"#ff3b3b"

        ctx.fillRect(
            x+w*0.25,
            Math.min(o,cl),
            w*0.5,
            Math.abs(o-cl)||2
        )
    })
}

// ===== START TRADE
function startTrade(){

    generate()

    entry = price
    timeLeft = active.time

    running = true
    lastTime = performance.now()

    requestAnimationFrame(loop)
}

</script>

</body>
</html>
