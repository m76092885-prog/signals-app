<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>CYBER AI SIGNALS</title>

<style>

body{

    margin:0;
    padding:0;

    background:#050816;

    color:white;

    font-family:Arial;

    overflow-x:hidden;
}

/* ========================================== */
/* BACKGROUND */
/* ========================================== */

.bg{

    position:fixed;

    width:100%;
    height:100%;

    background:
    radial-gradient(circle at top,#00f0ff22,transparent 40%),
    radial-gradient(circle at bottom,#ff00ff22,transparent 40%),
    #050816;

    z-index:-2;
}

/* ========================================== */
/* GRID */
/* ========================================== */

.grid{

    position:fixed;

    width:100%;
    height:100%;

    background-image:
    linear-gradient(#0ff1 1px, transparent 1px),
    linear-gradient(90deg,#0ff1 1px, transparent 1px);

    background-size:40px 40px;

    z-index:-1;

    opacity:0.2;
}

/* ========================================== */
/* TITLE */
/* ========================================== */

.title{

    text-align:center;

    margin-top:20px;

    font-size:32px;

    font-weight:bold;

    color:#00f0ff;

    text-shadow:0 0 15px #00f0ff;
}

/* ========================================== */
/* CONTAINER */
/* ========================================== */

.container{

    padding:20px;

    display:flex;

    flex-direction:column;

    gap:20px;
}

/* ========================================== */
/* SIGNAL CARD */
/* ========================================== */

.signal{

    background:#0b1224cc;

    border:1px solid #00f0ff55;

    border-radius:20px;

    padding:20px;

    backdrop-filter:blur(10px);

    box-shadow:
    0 0 20px #00f0ff22;

    transition:0.3s;
}

.signal:hover{

    transform:translateY(-4px);

    box-shadow:
    0 0 25px #00f0ff66;
}

.buy{

    border-left:5px solid #00ff88;
}

.sell{

    border-left:5px solid #ff3b5c;
}

/* ========================================== */
/* ROW */
/* ========================================== */

.row{

    display:flex;

    justify-content:space-between;

    margin-top:10px;
}

/* ========================================== */
/* BUTTON */
/* ========================================== */

.btn{

    margin-top:15px;

    width:100%;

    padding:12px;

    border:none;

    border-radius:15px;

    background:#00f0ff22;

    color:#00f0ff;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.btn:hover{

    background:#00f0ff44;
}

/* ========================================== */
/* MODAL */
/* ========================================== */

.modal{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:90%;

    max-width:420px;

    background:#0b1224ee;

    border:1px solid #00f0ff55;

    border-radius:20px;

    padding:20px;

    display:none;

    z-index:999;

    box-shadow:
    0 0 30px #00f0ff55;

    backdrop-filter:blur(10px);
}

.modal h2{

    margin-top:0;

    color:#00f0ff;
}

.close{

    margin-top:20px;

    width:100%;

    padding:12px;

    border:none;

    border-radius:15px;

    background:#ff005522;

    color:#ff0055;

    font-weight:bold;
}

/* ========================================== */
/* LEVELS */
/* ========================================== */

.levelAplus{

    color:#00f0ff;
}

.levelA{

    color:#00ff88;
}

.levelB{

    color:#ffaa00;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="grid"></div>

<div class="title">
😈 CYBER AI SIGNALS
</div>

<div class="container" id="signals">

</div>

<!-- ========================================== -->
<!-- MODAL -->
<!-- ========================================== -->

<div class="modal" id="modal">

    <h2 id="pair"></h2>

    <div class="row">
        <span>Signal:</span>
        <span id="signal"></span>
    </div>

    <div class="row">
        <span>Level:</span>
        <span id="level"></span>
    </div>

    <div class="row">
        <span>Score:</span>
        <span id="score"></span>
    </div>

    <div class="row">
        <span>Expiration:</span>
        <span id="expiration"></span>
    </div>

    <div class="row">
        <span>Buyers:</span>
        <span id="buyers"></span>
    </div>

    <div class="row">
        <span>Sellers:</span>
        <span id="sellers"></span>
    </div>

    <div class="row">
        <span>ADX:</span>
        <span id="adx"></span>
    </div>

    <div class="row">
        <span>RSI:</span>
        <span id="rsi"></span>
    </div>

    <button
        class="close"
        onclick="closeModal()"
    >
        CLOSE
    </button>

</div>

<script>

const API =
"https://signals-ai-backend.onrender.com/signals";

/* ========================================== */
/* LOAD SIGNALS */
/* ========================================== */

async function loadSignals(){

    try{

        const res = await fetch(API);

        const data = await res.json();

        const container =
        document.getElementById("signals");

        container.innerHTML = "";

        data.forEach(signal => {

            const card =
            document.createElement("div");

            card.className =
            `signal ${
                signal.signal === "BUY"
                ? "buy"
                : "sell"
            }`;

            let levelClass = "levelB";

            if(signal.level === "A"){
                levelClass = "levelA";
            }

            if(signal.level === "A+"){
                levelClass = "levelAplus";
            }

            card.innerHTML = `

                <h2>
                    ${signal.pair}
                </h2>

                <div class="row">
                    <span>Signal</span>
                    <span>
                        ${signal.signal}
                    </span>
                </div>

                <div class="row">
                    <span>Score</span>
                    <span>
                        ${signal.score}%
                    </span>
                </div>

                <div class="row">
                    <span>Level</span>
                    <span class="${levelClass}">
                        ${signal.level}
                    </span>
                </div>

                <button class="btn">
                    OPEN DETAILS
                </button>
            `;

            card.onclick = () => {

                openModal(signal);
            };

            container.appendChild(card);

        });

    }catch(err){

        console.log(err);
    }
}

/* ========================================== */
/* OPEN MODAL */
/* ========================================== */

function openModal(signal){

    document.getElementById(
        "modal"
    ).style.display = "block";

    document.getElementById(
        "pair"
    ).innerText = signal.pair;

    document.getElementById(
        "signal"
    ).innerText = signal.signal;

    document.getElementById(
        "level"
    ).innerText = signal.level;

    document.getElementById(
        "score"
    ).innerText =
    signal.score + "%";

    document.getElementById(
        "expiration"
    ).innerText =
    signal.expiration;

    document.getElementById(
        "buyers"
    ).innerText =
    signal.buyers + "%";

    document.getElementById(
        "sellers"
    ).innerText =
    signal.sellers + "%";

    document.getElementById(
        "adx"
    ).innerText =
    signal.adx;

    document.getElementById(
        "rsi"
    ).innerText =
    signal.rsi;
}

/* ========================================== */
/* CLOSE MODAL */
/* ========================================== */

function closeModal(){

    document.getElementById(
        "modal"
    ).style.display = "none";
}

/* ========================================== */
/* AUTO REFRESH */
/* ========================================== */

loadSignals();

setInterval(loadSignals, 10000);

</script>

</body>
</html>
