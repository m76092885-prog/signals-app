<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Signals App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f1115;
    color: white;
}

.header {
    padding: 20px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    background: #151924;
}

.card {
    background: #1b2030;
    margin: 10px;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.symbol {
    font-size: 18px;
    font-weight: bold;
}

.signal-buy {
    color: #00ff99;
    font-weight: bold;
}

.signal-sell {
    color: #ff4d4d;
    font-weight: bold;
}

.prob {
    font-size: 20px;
    margin-top: 5px;
}

.refresh {
    text-align: center;
    padding: 10px;
    opacity: 0.6;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="header">📊 LIVE SIGNALS</div>

<div id="app">Loading...</div>

<div class="refresh">Auto update every 5 sec</div>

<script>
const API = "https://signals-app-yk11.onrender.com";

async function loadSignals() {
    try {
        const res = await fetch(API + "/signals");
        const data = await res.json();

        let html = "";

        if (data.length === 0) {
            html = "<div class='card'>No signals yet...</div>";
        }

        data.slice().reverse().forEach(s => {

            const isBuy = s.signal === "BUY";

            html += `
                <div class="card">
                    <div class="symbol">${s.symbol}</div>

                    <div class="${isBuy ? 'signal-buy' : 'signal-sell'}">
                        ${s.signal}
                    </div>

                    <div class="prob">
                        🔥 ${s.probability}%
                    </div>
                </div>
            `;
        });

        document.getElementById("app").innerHTML = html;

    } catch (e) {
        document.getElementById("app").innerHTML =
            "<div class='card'>Error loading data</div>";
    }
}

setInterval(loadSignals, 5000);
loadSignals();
</script>

</body>
</html>
