<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CYBER AI SNIPER</title>

<script
src="https://s3.tradingview.com/tv.js">
</script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:Arial;
}

body{

    background:
    linear-gradient(
        135deg,
        #050816,
        #09111d,
        #07121f
    );

    min-height:100vh;

    overflow-x:hidden;

    color:white;
}

body::before{

    content:"";

    position:fixed;

    width:100%;
    height:100%;

    background:
    radial-gradient(
        circle at top left,
        #00ffee22,
        transparent 40%
    ),
    radial-gradient(
        circle at bottom right,
        #ff00ff22,
        transparent 40%
    );

    z-index:-1;
}

.header{

    text-align:center;

    padding:25px;
}

.logo{

    font-size:36px;

    font-weight:bold;

    color:#00ffee;

    text-shadow:
    0 0 10px #00ffee,
    0 0 20px #00ffee;
}

.sub{

    color:#aaa;

    margin-top:10px;
}

.analytics-box{

    width:95%;

    margin:20px auto;

    background:rgba(0,0,0,0.45);

    border:1px solid #00ffee44;

    border-radius:25px;

    padding:20px;

    backdrop-filter:blur(20px);

    box-shadow:
    0 0 25px #00ffee22;
}

.analytics-title{

    color:#00ffee;

    text-align:center;

    font-size:22px;

    margin-bottom:20px;

    font-weight:bold;
}

.analytics-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:15px;
}

.analytics-card{

    background:#09111d;

    border-radius:20px;

    padding:20px;

    text-align:center;

    border:1px solid #00ffee22;
}

.analytics-card div{

    font-size:30px;

    color:#00ffee;

    font-weight:bold;
}

.analytics-card span{

    color:#aaa;

    font-size:13px;
}

.signals{

    width:95%;

    margin:25px auto;

    display:flex;

    flex-direction:column;

    gap:20px;
}

.signal{

    background:rgba(0,0,0,0.45);

    border:1px solid #00ffee44;

    border-radius:24px;

    padding:20px;

    backdrop-filter:blur(20px);

    box-shadow:
    0 0 25px #00ffee22;

    position:relative;

    overflow:hidden;

    animation:fade 0.4s ease;

    cursor:pointer;

    transition:0.3s;
}

.signal:hover{

    transform:scale(1.02);

    box-shadow:
    0 0 35px #00ffee55;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.signal::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:3px;

    background:
    linear-gradient(
        90deg,
        #00ffee,
        #ff00ff
    );
}

.top{

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.pair{

    font-size:28px;

    font-weight:bold;

    color:#00ffee;
}

.level{

    padding:8px 16px;

    border-radius:12px;

    background:#00ffee22;

    color:#00ffee;

    font-weight:bold;
}

.buy{

    color:#00ff88;
}

.sell{

    color:#ff3366;
}

.signal-type{

    margin-top:15px;

    font-size:26px;

    font-weight:bold;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:15px;

    margin-top:20px;
}

.card{

    background:#09111d;

    border-radius:16px;

    padding:16px;

    text-align:center;

    border:1px solid #00ffee22;
}

.card-title{

    color:#aaa;

    font-size:13px;
}

.card-value{

    margin-top:10px;

    font-size:24px;

    color:#00ffee;

    font-weight:bold;
}

.footer{

    margin-top:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.market{

    color:#ff00ff;

    font-weight:bold;
}

.time{

    color:#888;

    font-size:12px;
}

.loading{

    text-align:center;

    color:#00ffee;

    margin-top:40px;
}

#chartModal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.95);

    z-index:9999;
}

.closeChart{

    position:absolute;

    top:20px;
    right:25px;

    font-size:42px;

    color:white;

    cursor:pointer;

    z-index:10000;
}

#tvchart{

    width:100%;
    height:100%;
}

.resultCard{

    margin-bottom:15px;

    padding:15px;

    border-radius:16px;

    background:#09111d;
}

</style>

</head>

<body>

<div class="header">

    <div class="logo">
        CYBER AI SNIPER
    </div>

    <div class="sub">
        Adaptive Smart Liquidity Engine
    </div>

</div>

<div class="analytics-box">

    <div class="analytics-title">
        AI PERFORMANCE
    </div>

    <div class="analytics-grid">

        <div class="analytics-card">
            <div id="totalTrades">0</div>
            <span>TOTAL</span>
        </div>

        <div class="analytics-card">
            <div id="wins">0</div>
            <span>WINS</span>
        </div>

        <div class="analytics-card">
            <div id="losses">0</div>
            <span>LOSSES</span>
        </div>

        <div class="analytics-card">
            <div id="winrate">0%</div>
            <span>WINRATE</span>
        </div>

    </div>

</div>

<div class="analytics-box">

    <div class="analytics-title">
        LAST RESULTS
    </div>

    <div id="historyPanel">

        <div class="loading">
            Loading Results...
        </div>

    </div>

</div>

<div class="signals" id="signals">

    <div class="loading">
        Loading AI Signals...
    </div>

</div>

<div id="chartModal">

    <div class="closeChart"
    onclick="closeChart()">
        ×
    </div>

    <div id="tvchart"></div>

</div>

<script>

const API =
"https://signals-ai-backend.onrender.com"

async function loadAnalytics(){

    try{

        const res = await fetch(
            API + "/analytics"
        )

        const data = await res.json()

        document.getElementById(
            "totalTrades"
        ).innerText =
        data.total_signals

        document.getElementById(
            "wins"
        ).innerText =
        data.wins

        document.getElementById(
            "losses"
        ).innerText =
        data.losses

        document.getElementById(
            "winrate"
        ).innerText =
        data.winrate + "%"

    }catch(err){

        console.log(err)
    }
}

async function loadHistory(){

    try{

        const res = await fetch(
            API + "/results"
        )

        const data = await res.json()

        const panel =
        document.getElementById(
            "historyPanel"
        )

        panel.innerHTML = ""

        data.reverse()

        data.slice(0,10).forEach(item => {

            const div =
            document.createElement("div")

            div.className = "resultCard"

            div.style.border =
            item.result === "WIN"
            ? "1px solid #00ff88"
            : "1px solid #ff3366"

            div.innerHTML = `

            <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            ">

                <div style="
                color:#00ffee;
                font-size:20px;
                font-weight:bold;
                ">

                    ${item.pair}

                </div>

                <div style="
                color:
                ${item.result === "WIN"
                ? "#00ff88"
                : "#ff3366"};

                font-weight:bold;
                font-size:18px;
                ">

                    ${item.result}

                </div>

            </div>

            <div style="
            margin-top:10px;
            color:#aaa;
            ">

                ${item.signal}

            </div>
            `

            panel.appendChild(div)
        })

    }catch(err){

        console.log(err)
    }
}

async function loadSignals(){

    try{

        const res = await fetch(
            API + "/signals"
        )

        const data = await res.json()

        const container =
        document.getElementById(
            "signals"
        )

        container.innerHTML = ""

        data.forEach(signal => {

            const div =
            document.createElement("div")

            div.className = "signal"

            div.onclick = () => {

                openChart(signal.pair)
            }

            div.innerHTML = `

            <div class="top">

                <div class="pair">
                    ${signal.pair}
                </div>

                <div class="level">
                    ${signal.level}
                </div>

            </div>

            <div class="signal-type
            ${signal.signal === "BUY"
            ? "buy"
            : "sell"}">

                ${signal.signal}

            </div>

            <div class="grid">

                <div class="card">

                    <div class="card-title">
                        SCORE
                    </div>

                    <div class="card-value">
                        ${signal.score}%
                    </div>

                </div>

                <div class="card">

                    <div class="card-title">
                        EXPIRATION
                    </div>

                    <div class="card-value">
                        ${signal.expiration}
                    </div>

                </div>

                <div class="card">

                    <div class="card-title">
                        BUYERS
                    </div>

                    <div class="card-value">
                        ${signal.buyers}%
                    </div>

                </div>

                <div class="card">

                    <div class="card-title">
                        SELLERS
                    </div>

                    <div class="card-value">
                        ${signal.sellers}%
                    </div>

                </div>

                <div class="card">

                    <div class="card-title">
                        RSI
                    </div>

                    <div class="card-value">
                        ${signal.rsi}
                    </div>

                </div>

                <div class="card">

                    <div class="card-title">
                        ADX
                    </div>

                    <div class="card-value">
                        ${signal.adx}
                    </div>

                </div>

            </div>

            <div class="footer">

                <div class="market">
                    ${signal.market}
                </div>

                <div class="time">
                    ${signal.time}
                </div>

            </div>
            `

            container.appendChild(div)
        })

    }catch(err){

        console.log(err)
    }
}

function openChart(pair){

    document.getElementById(
        "chartModal"
    ).style.display = "block"

    document.getElementById(
        "tvchart"
    ).innerHTML = ""

    new TradingView.widget({

        autosize:true,

        symbol:"OANDA:" + pair,

        interval:"1",

        timezone:"Etc/UTC",

        theme:"dark",

        style:"1",

        locale:"en",

        toolbar_bg:"#0a0f1c",

        enable_publishing:false,

        hide_side_toolbar:false,

        allow_symbol_change:true,

        container_id:"tvchart"
    })
}

function closeChart(){

    document.getElementById(
        "chartModal"
    ).style.display = "none"
}

loadSignals()

loadAnalytics()

loadHistory()

setInterval(loadSignals,5000)

setInterval(loadAnalytics,5000)

setInterval(loadHistory,5000)

</script>

</body>
</html>
