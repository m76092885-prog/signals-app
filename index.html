<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ===== GLOBAL ===== */
body{
    margin:0;
    background: radial-gradient(circle at top, #0b0f1a, #05070d);
    color:#e0e6ff;
    font-family:monospace;
}

/* ===== SIGNAL SCREEN ===== */
#main{
    padding:20px;
}

.title{
    font-size:20px;
    margin-bottom:10px;
    color:#ff4dff;
    text-shadow:0 0 8px #ff4dff;
}

.signal{
    padding:15px;
    margin-bottom:10px;

    background:rgba(20,20,40,0.6);
    border-radius:12px;

    border:1px solid rgba(255,0,255,0.2);

    cursor:pointer;
    transition:.2s;
}

.signal:hover{
    transform:scale(1.02);
    box-shadow:0 0 15px rgba(255,0,255,0.4);
}

/* ===== WINDOWS ===== */
.window{
    position:fixed;
    left:10px;
    right:10px;
    border-radius:16px;
}

/* ===== CHART ===== */
#chartWindow{
    top:10px;
    height:50vh;

    background:
    linear-gradient(#05070d,#05070d),
    repeating-linear-gradient(
        0deg,
        rgba(0,200,255,0.06) 0px,
        rgba(0,200,255,0.06) 1px,
        transparent 1px,
        transparent 30px
    ),
    repeating-linear-gradient(
        90deg,
        rgba(0,200,255,0.06) 0px,
        rgba(0,200,255,0.06) 1px,
        transparent 1px,
        transparent 30px
    );
}

/* ===== INFO ===== */
#infoWindow{
    bottom:10px;
    height:40vh;
    padding:15px;

    background:rgba(10,10,30,0.9);

    display:flex;
    flex-direction:column;

    border:1px solid rgba(255,0,255,0.2);

    box-shadow:0 0 20px rgba(255,0,255,0.15);
}

/* ===== TEXT ===== */
.green{
    color:#ff4dff;
    text-shadow:0 0 6px #ff4dff;
}

.red{
    color:#ff2a6d;
    text-shadow:0 0 6px #ff2a6d;
}

/* ===== BACK BUTTON ===== */
.back{
    margin-top:10px;
    padding:12px;
    text-align:center;

    background:#111;
    border-radius:10px;

    cursor:pointer;
    transition:.2s;

    border:1px solid rgba(255,0,255,0.3);
}

.back:hover{
    box-shadow:0 0 15px rgba(255,0,255,0.6);
}

/* ===== CANVAS ===== */
canvas{
    width:100%;
    height:100%;
    touch-action:none;
}

</style>
</head>

<body>

<!-- ===== SIGNALS ===== -->
<div id="main">
    <div class="title">Signals</div>
    <div id="signals"></div>
</div>

<!-- ===== CHART ===== -->
<div id="chartWindow" class="window" style="display:none">
    <canvas id="chart"></canvas>
</div>

<!-- ===== INFO ===== -->
<div id="infoWindow" class="window" style="display:none">

    <div id="pair"></div>
    <div id="timer"></div>
    <div id="profit"></div>

    <div class="back" onclick="goBack()">← Назад</div>

</div>

<script>

// ===== SIGNAL DATA
let signals=[
    {pair:"EUR/USD",dir:"BUY",time:30},
    {pair:"GBP/USD",dir:"SELL",time:30},
    {pair:"BTC/USDT",dir:"BUY",time:30}
]

// ===== RENDER SIGNALS
const signalsEl=document.getElementById("signals")

function renderSignals(){
    signalsEl.innerHTML=""

    signals.forEach((s,i)=>{

        let c=s.dir==="BUY"?"#ff4dff":"#ff2a6d"

        signalsEl.innerHTML+=`
        <div class="signal" onclick="openTrade(${i})">
            <b>${s.pair}</b><br>
            <span style="color:${c}">${s.dir}</span>
        </div>`
    })
}
renderSignals()

// ===== NAVIGATION
let active=null

function openTrade(i){

    active=signals[i]

    main.style.display="none"
    chartWindow.style.display="block"
    infoWindow.style.display="flex"

    pair.innerText=active.pair+" | "+active.dir

    start()
}

function goBack(){
    running=false

    chartWindow.style.display="none"
    infoWindow.style.display="none"
    main.style.display="block"

    offsetX=0
}

// ===== CANVAS
const canvas=document.getElementById("chart")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight*0.5

let candles=[]
let current=null
let price=100
let entry=0

function newCandle(p){
    return {open:p,high:p,low:p,close:p}
}

// ===== GENERATE HISTORY
function generate(){
    candles=[]
    for(let i=0;i<80;i++){
        let o=price
        let c=o+(Math.random()-0.5)*1.5

        candles.push({
            open:o,
            high:Math.max(o,c),
            low:Math.min(o,c),
            close:c
        })

        price=c
    }

    current=newCandle(price)
}

// ===== DRAG
let dragging=false,startX=0,offsetX=0

canvas.addEventListener("mousedown",e=>{
    dragging=true
    startX=e.clientX
})

canvas.addEventListener("touchstart",e=>{
    dragging=true
    startX=e.touches[0].clientX
})

window.addEventListener("mousemove",e=>{
    if(!dragging)return
    offsetX+=(e.clientX-startX)
    startX=e.clientX
})

window.addEventListener("touchmove",e=>{
    if(!dragging)return
    offsetX+=(e.touches[0].clientX-startX)
    startX=e.touches[0].clientX
})

window.addEventListener("mouseup",()=>dragging=false)
window.addEventListener("touchend",()=>dragging=false)

// ===== LOOP
let running=false,last=0,timeLeft=0

function loop(t){

    if(!running)return

    let dt=(t-last)/1000
    last=t

    // плавная цена
    price+=(Math.random()-0.5)*0.4*dt*60

    current.high=Math.max(current.high,price)
    current.low=Math.min(current.low,price)
    current.close=price

    // новая свеча
    if(Math.floor(t/2000)!==Math.floor((t-16)/2000)){
        candles.push(current)
        if(candles.length>120)candles.shift()
        current=newCandle(price)
    }

    draw()

    timeLeft-=dt

    let profitVal=price-entry

    timer.innerText="Time: "+Math.max(0,Math.floor(timeLeft))
    profit.innerText="P/L: "+profitVal.toFixed(2)

    profit.className=profitVal>=0?"green":"red"

    requestAnimationFrame(loop)
}

// ===== DRAW
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height)

    let all=[...candles,current]

    let max=Math.max(...all.map(c=>c.high))
    let min=Math.min(...all.map(c=>c.low))
    let range=max-min||1

    let w=canvas.width/30
    let center=Math.floor(all.length/2)

    all.forEach((c,i)=>{

        let x=(i-center)*w + canvas.width/2 + offsetX

        let scale=canvas.height/range

        let o=canvas.height-(c.open-min)*scale
        let cl=canvas.height-(c.close-min)*scale
        let hi=canvas.height-(c.high-min)*scale
        let lo=canvas.height-(c.low-min)*scale

        let up=c.close>c.open

        // фитиль
        ctx.strokeStyle=up?"#00c8ff":"#ff2a6d"
        ctx.lineWidth=1

        ctx.beginPath()
        ctx.moveTo(x+w/2,hi)
        ctx.lineTo(x+w/2,lo)
        ctx.stroke()

        // тело
        ctx.fillStyle=up?"#ff4dff":"#ff2a6d"

        ctx.fillRect(
            x+w*0.25,
            Math.min(o,cl),
            w*0.5,
            Math.max(2,Math.abs(o-cl))
        )
    })
}

// ===== START
function start(){
    generate()
    entry=price
    timeLeft=active.time

    running=true
    last=performance.now()

    requestAnimationFrame(loop)
}

</script>

</body>
</html>
