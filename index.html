<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#020617;
    color:#fff;
    font-family:Arial;
}

/* график */
.trade{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    height:70%;
    background:#0f172a;
    border-radius:20px;
    display:flex;
    flex-direction:column;
}

#chart{
    width:100%;
    height:70%;
}

.info{
    padding:10px;
}
</style>
</head>

<body>

<div class="trade">
    <canvas id="chart"></canvas>

    <div class="info">
        <div id="price">Price:</div>
        <div id="status">Connecting...</div>
    </div>
</div>

<script>

const canvas = document.getElementById("chart")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight * 0.6

let candles = []
let price = 0

// 🔥 WebSocket
const ws = new WebSocket("ws://127.0.0.1:8000/ws")

ws.onopen = ()=>{
    document.getElementById("status").innerText = "Connected"
}

ws.onmessage = (e)=>{

    const data = JSON.parse(e.data)

    candles = data.candles
    price = data.price

    draw()
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height)

    if(candles.length === 0) return

    let w = canvas.width / candles.length
    let mid = canvas.height/2
    let scale = 2000

    candles.forEach((c,i)=>{

        let x = i*w

        let o = mid - (c.open-price)*scale
        let cl = mid - (c.close-price)*scale
        let h = mid - (c.high-price)*scale
        let l = mid - (c.low-price)*scale

        ctx.strokeStyle = "#aaa"
        ctx.beginPath()
        ctx.moveTo(x+w/2,h)
        ctx.lineTo(x+w/2,l)
        ctx.stroke()

        ctx.fillStyle = c.close > c.open ? "#22c55e" : "#ef4444"

        ctx.fillRect(
            x,
            Math.min(o,cl),
            w*0.6,
            Math.abs(o-cl) || 1
        )
    })

    document.getElementById("price").innerText = "Price: " + price
}

</script>

</body>
</html>
