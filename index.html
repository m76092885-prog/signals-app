<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CYBER AI SNIPER</title>

<script
src="https://s3.tradingview.com/tv.js">
</script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    background:
    linear-gradient(
        135deg,
        #040816,
        #08101d,
        #050b14
    );

    color:white;

    overflow:hidden;

    height:100vh;
}

body::before{

    content:"";

    position:fixed;

    width:100%;
    height:100%;

    background:
    radial-gradient(
        circle at top left,
        #00ffee22,
        transparent 40%
    ),
    radial-gradient(
        circle at bottom right,
        #ff00ff22,
        transparent 40%
    );

    z-index:-1;
}

.screen{

    position:absolute;

    width:100%;
    height:100%;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    padding:25px;

    animation:fade 0.4s ease;
}

.active{

    display:flex;
}

@keyframes fade{

    from{
        opacity:0;
        transform:scale(1.03);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.logo{

    font-size:48px;

    font-weight:bold;

    color:#00ffee;

    text-shadow:
    0 0 25px #00ffee;
}

.winrateBox{

    margin-top:40px;

    width:90%;

    max-width:430px;

    background:rgba(0,0,0,0.45);

    border:1px solid #00ffee44;

    border-radius:30px;

    padding:35px;

    text-align:center;

    backdrop-filter:blur(20px);

    box-shadow:
    0 0 35px #00ffee22;
}

.winrateTitle{

    color:#aaa;

    font-size:18px;
}

.winrate{

    margin-top:15px;

    font-size:78px;

    font-weight:bold;

    color:#00ffee;

    text-shadow:
    0 0 20px #00ffee;
}

.stats{

    margin-top:25px;

    display:flex;

    justify-content:space-around;
}

.stats div{

    text-align:center;
}

.stats strong{

    display:block;

    font-size:26px;

    color:#00ffee;
}

.btn{

    margin-top:50px;

    padding:20px 45px;

    border:none;

    border-radius:20px;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #00ffee,
        #00bfff
    );

    color:black;

    box-shadow:
    0 0 25px #00ffee55;

    transition:0.3s;
}

.btn:hover{

    transform:scale(1.05);
}

.qualityWrap{

    display:flex;

    flex-direction:column;

    gap:25px;

    width:90%;

    max-width:420px;
}

.qualityBtn{

    padding:25px;

    border-radius:25px;

    border:1px solid #00ffee55;

    background:rgba(0,0,0,0.45);

    color:white;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.qualityBtn:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 30px #00ffee44;
}

.backBtn{

    position:absolute;

    top:30px;
    left:30px;

    padding:12px 25px;

    border:none;

    border-radius:15px;

    background:#00ffee;

    color:black;

    font-weight:bold;

    font-size:18px;

    cursor:pointer;

    box-shadow:
    0 0 20px #00ffee55;

    z-index:999;
}

.carScene{

    position:relative;

    width:520px;
    height:260px;

    display:flex;

    justify-content:center;
    align-items:center;
}

.carBody{

    position:absolute;

    width:420px;
    height:120px;

    background:
    linear-gradient(
        135deg,
        #0f0f0f,
        #1c1c1c,
        #050505
    );

    border-radius:
    90px 140px 40px 40px;

    box-shadow:
    0 0 50px #00ffee22,
    inset 0 0 20px #333;
}

.carBody::before{

    content:"";

    position:absolute;

    width:180px;
    height:55px;

    background:#111;

    border-radius:
    40px 60px 10px 10px;

    top:-40px;
    left:120px;

    box-shadow:
    inset 0 0 10px #333;
}

.carGlow{

    position:absolute;

    width:460px;
    height:140px;

    border-radius:100px;

    background:
    radial-gradient(
        circle,
        #00ffee22,
        transparent 70%
    );

    filter:blur(30px);

    z-index:-1;
}

.wheel{

    position:absolute;

    width:100px;
    height:100px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #111 20%,
        #000 70%
    );

    border:10px solid #1b1b1b;

    animation:
    spin 1.5s linear infinite;

    box-shadow:
    0 0 25px #00ffee55,
    inset 0 0 20px #000;
}

.leftWheel{

    bottom:0;
    left:85px;
}

.rightWheel{

    bottom:0;
    right:85px;
}

.wheelInner{

    position:absolute;

    width:100%;
    height:100%;

    border-radius:50%;

    background:
    repeating-conic-gradient(

        #999 0deg,
        #222 15deg,
        #999 30deg

    );

    opacity:0.7;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.searchText{

    margin-top:40px;

    font-size:30px;

    color:#00ffee;

    text-shadow:
    0 0 15px #00ffee;
}

.signalCard{

    width:95%;

    max-width:520px;

    background:rgba(0,0,0,0.45);

    border:1px solid #00ffee55;

    border-radius:30px;

    padding:30px;

    backdrop-filter:blur(20px);

    box-shadow:
    0 0 35px #00ffee22;
}

.pair{

    font-size:52px;

    font-weight:bold;

    color:#00ffee;

    text-align:center;
}

.action{

    margin-top:20px;

    text-align:center;

    font-size:48px;

    font-weight:bold;
}

.buy{

    color:#00ff88;
}

.sell{

    color:#ff3366;
}

.confidence{

    margin-top:20px;

    text-align:center;

    font-size:32px;

    color:#ff00ff;

    font-weight:bold;
}

.exp{

    margin-top:15px;

    text-align:center;

    color:#aaa;

    font-size:22px;
}

.details{

    margin-top:30px;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:15px;
}

.detail{

    background:#09111d;

    border-radius:16px;

    padding:15px;

    text-align:center;
}

.detailTitle{

    color:#888;

    font-size:12px;
}

.detailValue{

    margin-top:10px;

    color:#00ffee;

    font-size:22px;

    font-weight:bold;
}

#chart{

    margin-top:30px;

    width:100%;

    height:320px;

    border-radius:20px;

    overflow:hidden;
}

</style>

</head>

<body>

<div class="screen active"
id="homeScreen">

    <div class="logo">

        CYBER AI SNIPER

    </div>

    <div class="winrateBox">

        <div class="winrateTitle">

            TODAY WINRATE

        </div>

        <div class="winrate"
        id="winrate">

            0%

        </div>

        <div class="stats">

            <div>

                <strong id="wins">
                    0
                </strong>

                WINS

            </div>

            <div>

                <strong id="losses">
                    0
                </strong>

                LOSSES

            </div>

        </div>

    </div>

    <button class="btn"
    onclick="showQuality()">

        GET SIGNAL

    </button>

</div>

<div class="screen"
id="qualityScreen">

    <button class="backBtn"
    onclick="showHome()">

        BACK

    </button>

    <div class="qualityWrap">

        <button class="qualityBtn"
        onclick="startSearch('A+')">

            A+ SNIPER

        </button>

        <button class="qualityBtn"
        onclick="startSearch('A')">

            A

        </button>

        <button class="qualityBtn"
        onclick="startSearch('B')">

            B

        </button>

    </div>

</div>

<div class="screen"
id="searchScreen">

    <button class="backBtn"
    onclick="showQuality()">

        BACK

    </button>

    <div class="carScene">

        <div class="carBody"></div>

        <div class="carGlow"></div>

        <div class="wheel leftWheel">

            <div class="wheelInner"></div>

        </div>

        <div class="wheel rightWheel">

            <div class="wheelInner"></div>

        </div>

    </div>

    <div class="searchText">

        SEARCHING ELITE ENTRY...

    </div>

</div>

<div class="screen"
id="signalScreen">

    <button class="backBtn"
    onclick="showHome()">

        BACK

    </button>

    <div class="signalCard">

        <div class="pair"
        id="pair">

            EURUSD

        </div>

        <div class="action"
        id="action">

            BUY

        </div>

        <div class="confidence"
        id="confidence">

            94%

        </div>

        <div class="exp"
        id="expiration">

            3 MIN

        </div>

        <div class="details">

            <div class="detail">

                <div class="detailTitle">

                    LIQUIDITY

                </div>

                <div class="detailValue">

                    HIGH

                </div>

            </div>

            <div class="detail">

                <div class="detailTitle">

                    TREND

                </div>

                <div class="detailValue">

                    BULL

                </div>

            </div>

            <div class="detail">

                <div class="detailTitle">

                    MOMENTUM

                </div>

                <div class="detailValue">

                    STRONG

                </div>

            </div>

        </div>

        <div id="chart"></div>

    </div>

</div>

<script>

const API =
"https://signals-ai-backend.onrender.com"

function show(screen){

    document
    .querySelectorAll(".screen")
    .forEach(s =>
        s.classList.remove("active")
    )

    document
    .getElementById(screen)
    .classList.add("active")
}

function showHome(){

    show("homeScreen")
}

function showQuality(){

    show("qualityScreen")
}

async function loadStats(){

    try{

        const res =
        await fetch(
            API + "/analytics"
        )

        const data =
        await res.json()

        document
        .getElementById("winrate")
        .innerText =
        data.winrate + "%"

        document
        .getElementById("wins")
        .innerText =
        data.wins

        document
        .getElementById("losses")
        .innerText =
        data.losses

    }catch(err){

        console.log(err)
    }
}

async function startSearch(level){

    show("searchScreen")

    let found = false

    while(!found){

        try{

            const res =
            await fetch(
                API + "/signals"
            )

            const data =
            await res.json()

            let filtered =
            data.filter(s => {

                if(level === "A+")
                    return s.score >= 90

                if(level === "A")
                    return s.score >= 75

                return s.score >= 60
            })

            if(filtered.length > 0){

                const signal =
                filtered[0]

                showSignal(signal)

                found = true
            }

        }catch(err){

            console.log(err)
        }

        await new Promise(r =>
            setTimeout(r,3000)
        )
    }
}

function showSignal(signal){

    show("signalScreen")

    document
    .getElementById("pair")
    .innerText =
    signal.pair

    const action =
    document.getElementById("action")

    action.innerText =
    signal.signal

    action.className =
    "action " +
    (
        signal.signal === "BUY"
        ? "buy"
        : "sell"
    )

    document
    .getElementById("confidence")
    .innerText =
    signal.score + "%"

    document
    .getElementById("expiration")
    .innerText =
    signal.expiration.toUpperCase()

    document
    .getElementById("chart")
    .innerHTML = ""

    new TradingView.widget({

        autosize:true,

        symbol:
        "OANDA:" + signal.pair,

        interval:"1",

        timezone:"Etc/UTC",

        theme:"dark",

        style:"1",

        locale:"en",

        toolbar_bg:"#0a0f1c",

        enable_publishing:false,

        hide_side_toolbar:false,

        allow_symbol_change:false,

        container_id:"chart"
    })
}

loadStats()

</script>

</body>
</html>
