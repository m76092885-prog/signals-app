<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI SIGNALS</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

#signals{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.buy{
    border-left:6px solid #22c55e;
}

.sell{
    border-left:6px solid #ef4444;
}

.levelA{
    color:#22c55e;
    font-weight:bold;
}

.levelB{
    color:#facc15;
    font-weight:bold;
}

.levelAplus{
    color:#38bdf8;
    font-weight:bold;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
}

.loading{
    text-align:center;
    margin-top:50px;
    font-size:20px;
}

</style>
</head>

<body>

<h1>😈 AI SIGNALS</h1>

<div id="signals">
    <div class="loading">
        Loading AI signals...
    </div>
</div>

<script>

const API_URL =
"https://signals-ai-backend.onrender.com/signals";

async function loadSignals(){

    try{

        const response = await fetch(API_URL);

        const data = await response.json();

        const container =
        document.getElementById("signals");

        container.innerHTML = "";

        if(data.length === 0){

            container.innerHTML = `
                <div class="loading">
                    No signals now...
                </div>
            `;

            return;
        }

        data.forEach(signal => {

            let levelClass = "levelB";

            if(signal.level === "A"){
                levelClass = "levelA";
            }

            if(signal.level === "A+"){
                levelClass = "levelAplus";
            }

            const card = document.createElement("div");

            card.className =
                `card ${
                    signal.signal === "BUY"
                    ? "buy"
                    : "sell"
                }`;

            card.innerHTML = `

                <h2>
                    ${signal.pair}
                </h2>

                <div class="row">
                    <span>Signal:</span>
                    <span>
                        ${signal.signal}
                    </span>
                </div>

                <div class="row">
                    <span>Level:</span>
                    <span class="${levelClass}">
                        ${signal.level}
                    </span>
                </div>

                <div class="row">
                    <span>Score:</span>
                    <span>
                        ${signal.score}%
                    </span>
                </div>

                <div class="row">
                    <span>Expiration:</span>
                    <span>
                        ${signal.expiration}
                    </span>
                </div>

                <div class="row">
                    <span>Buyers:</span>
                    <span>
                        ${signal.buyers}%
                    </span>
                </div>

                <div class="row">
                    <span>Sellers:</span>
                    <span>
                        ${signal.sellers}%
                    </span>
                </div>

                <div class="row">
                    <span>ADX:</span>
                    <span>
                        ${signal.adx}
                    </span>
                </div>

                <div class="row">
                    <span>RSI:</span>
                    <span>
                        ${signal.rsi}
                    </span>
                </div>

            `;

            container.appendChild(card);

        });

    }catch(error){

        console.log(error);

        document.getElementById("signals").innerHTML = `
            <div class="loading">
                Backend offline...
            </div>
        `;

    }

}

loadSignals();

setInterval(loadSignals, 10000);

</script>

</body>
</html>
