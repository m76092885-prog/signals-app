<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

AI Futures Sniper

</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:Arial;
}

body{

    background:
    linear-gradient(
        180deg,
        #050816,
        #0b1020
    );

    color:white;

    overflow:hidden;
}

.screen{

    width:100vw;
    height:100vh;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;
}

.active{

    display:flex;
}

.panel{

    width:420px;

    background:
    rgba(255,255,255,0.05);

    border:
    1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(20px);

    border-radius:30px;

    padding:35px;

    box-shadow:
    0 0 40px rgba(0,255,255,0.15);
}

.title{

    font-size:34px;

    text-align:center;

    color:#00ffee;

    margin-bottom:20px;

    text-shadow:
    0 0 20px #00ffee;
}

.subtitle{

    text-align:center;

    opacity:0.7;

    margin-bottom:40px;
}

.btn{

    width:100%;

    padding:18px;

    border:none;

    border-radius:18px;

    background:#00ffee;

    color:black;

    font-weight:bold;

    font-size:18px;

    cursor:pointer;

    margin-top:20px;
}

.select{

    width:100%;

    padding:16px;

    margin-top:15px;

    border:none;

    border-radius:16px;

    background:#111827;

    color:white;

    font-size:16px;
}

.checkbox{

    margin-top:20px;

    display:flex;

    gap:10px;
}

.radar{

    width:180px;
    height:180px;

    border-radius:50%;

    border:6px solid #00ffee;

    box-shadow:
    0 0 40px #00ffee;

    animation:
    spin 2s linear infinite;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.scanText{

    margin-top:40px;

    font-size:28px;

    color:#00ffee;
}

.signalBox{

    width:500px;

    background:
    rgba(255,255,255,0.05);

    border:
    1px solid rgba(255,255,255,0.1);

    border-radius:30px;

    padding:35px;
}

.signalTitle{

    font-size:36px;

    color:#00ffee;

    margin-bottom:20px;
}

.signalValue{

    font-size:28px;

    margin-top:15px;
}

.buy{

    color:#00ff88;
}

.sell{

    color:#ff3355;
}

.reason{

    margin-top:10px;

    opacity:0.8;
}

</style>

</head>

<body>

<div class="screen active"
id="homeScreen">

    <div class="panel">

        <div class="title">

            AI FUTURES SNIPER

        </div>

        <div class="subtitle">

            The Most Powerful AI Futures Trading System

        </div>

        <button class="btn"
        onclick="showSettings()">

            GET SIGNAL

        </button>

    </div>

</div>

<div class="screen"
id="settingsScreen">

    <div class="panel">

        <div class="title">

            SIGNAL SETTINGS

        </div>

        <select class="select"
        id="asset">

            <option>

                CC1!

            </option>

        </select>

        <select class="select"
        id="timeframe">

            <option value="3m">

                3 MIN

            </option>

            <option value="5m">

                5 MIN

            </option>

            <option value="15m">

                15 MIN

            </option>

        </select>

        <div class="checkbox">

            <input type="checkbox"
            id="trendOnly">

            <label>

                ONLY TREND TRADES

            </label>

        </div>

        <button class="btn"
        onclick="startScan()">

            START AI SCAN

        </button>

    </div>

</div>

<div class="screen"
id="scanScreen">

    <div class="radar"></div>

    <div class="scanText">

        SCANNING MARKET STRUCTURE...

    </div>

</div>

<div class="screen"
id="signalScreen">

    <div class="signalBox">

        <div class="signalTitle">

            ELITE ENTRY FOUND

        </div>

        <div class="signalValue"
        id="side">

            BUY

        </div>

        <div class="signalValue"
        id="assetText">

            CC1!

        </div>

        <div class="signalValue"
        id="confidence">

            84%

        </div>

        <div class="signalValue"
        id="entry">

            ENTRY

        </div>

        <div class="signalValue"
        id="sl">

            SL

        </div>

        <div class="signalValue"
        id="tp">

            TP

        </div>

        <div id="reasons"></div>

    </div>

</div>

<script>

const API =

"https://signals-ai-backend.onrender.com"

function show(id){

    document
    .querySelectorAll(".screen")
    .forEach(s =>

        s.classList.remove("active")

    )

    document
    .getElementById(id)
    .classList.add("active")
}

function showSettings(){

    show("settingsScreen")
}

async function startScan(){

    show("scanScreen")

    const asset =
    document
    .getElementById("asset")
    .value

    const timeframe =
    document
    .getElementById("timeframe")
    .value

    const trendOnly =
    document
    .getElementById("trendOnly")
    .checked

    const res =
    await fetch(

        API +

        "/signal?asset=" +

        asset +

        "&timeframe=" +

        timeframe +

        "&trend_only=" +

        trendOnly

    )

    const data =
    await res.json()

    showSignal(data)
}

function showSignal(data){

    show("signalScreen")

    const side =
    document
    .getElementById("side")

    side.innerText =
    data.side

    side.className =
    "signalValue " +

    (
        data.side === "BUY"
        ? "buy"
        : "sell"
    )

    document
    .getElementById("assetText")
    .innerText =
    data.asset

    document
    .getElementById("confidence")
    .innerText =

    "SUCCESS RATE: " +

    data.confidence +

    "%"

    document
    .getElementById("entry")
    .innerText =

    "ENTRY: " +

    data.entry

    document
    .getElementById("sl")
    .innerText =

    "SL: " +

    data.sl

    document
    .getElementById("tp")
    .innerText =

    "TP1: " +

    data.tp1 +

    " | TP2: " +

    data.tp2

    const reasons =
    document
    .getElementById("reasons")

    reasons.innerHTML = ""

    data.reasons.forEach(r => {

        reasons.innerHTML +=

        `<div class="reason">

            • ${r}

        </div>`
    })
}

</script>

</body>

</html>
```
