<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#05070d;
    color:white;
    font-family:Arial;
}

/* ===== MAIN */
#main{
    padding:20px;
}

.title{
    font-size:24px;
    margin-bottom:15px;
}

.signal{
    background:linear-gradient(145deg,#0f172a,#020617);
    border:1px solid #1f2937;
    padding:16px;
    border-radius:16px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.2s;
}

.signal:hover{
    transform:scale(1.02);
    border-color:#38bdf8;
}

/* ===== TRADE */
#trade{
    display:none;
    height:100vh;
    flex-direction:column;
}

.chart-box{
    height:60%;
    background:#020617;
    border-bottom:1px solid #1f2937;
    position:relative;
}

.info-box{
    height:40%;
    padding:15px;
    background:#05070d;
}

.back{
    background:#111827;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:10px;
    display:inline-block;
}

/* glow */
.glow-green{
    box-shadow:0 0 40px rgba(34,197,94,0.4);
}

.glow-red{
    box-shadow:0 0 40px rgba(239,68,68,0.4);
}

canvas{
    width:100%;
    height:100%;
}

.green{ color:#22c55e }
.red{ color:#ef4444 }

</style>
</head>

<body>

<!-- ===== MAIN -->
<div id="main">
    <div class="title">Signals</div>
    <div id="signals"></div>
</div>

<!-- ===== TRADE -->
<div id="trade">

    <div class="chart-box">
        <canvas id="chart"></canvas>
    </div>

    <div class="info-box">
        <div class="back" onclick="back()">← Назад</div>

        <div id="pair"></div>
        <div id="timer"></div>
        <div id="profit"></div>
        <div id="reason"></div>
    </div>

</div>

<script>

// ===== TELEGRAM HARD RESET
(function(){
    function forceMain(){
        document.getElementById("main").style.display = "block"
        document.getElementById("trade").style.display = "none"
    }
    forceMain()
    setTimeout(forceMain,100)
    setTimeout(forceMain,500)
    document.addEventListener("visibilitychange", forceMain)
    window.addEventListener("focus", forceMain)
})()

// ===== SIGNALS
let signals = [
    {pair:"EUR/USD", direction:"CALL", reason:"RSI oversold", time:60},
    {pair:"GBP/USD", direction:"PUT", reason:"Resistance", time:60},
    {pair:"USD/JPY", direction:"CALL", reason:"Breakout", time:60},
]

// ===== RENDER
function render(){
    let box = document.getElementById("signals")
    box.innerHTML = ""

    signals.forEach((s,i)=>{
        box.innerHTML += `
            <div class="signal" onclick="openTrade(${i})">
                <b>${s.pair}</b><br>
                ${s.direction}
            </div>
        `
    })
}
render()

// ===== NAV
let active = null

function openTrade(i){
    active = signals[i]

    document.getElementById("main").style.display = "none"
    document.getElementById("trade").style.display = "flex"

    document.getElementById("pair").innerText =
        active.pair + " | " + active.direction

    document.getElementById("reason").innerText =
        "Reason: " + active.reason

    startTrade()
}

function back(){
    document.getElementById("trade").style.display = "none"
    document.getElementById("main").style.display = "block"
}

// ===== GRAPH
const canvas = document.getElementById("chart")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight * 0.6

let candles = []
let current = null
let price = 100
let entry = 0

function newCandle(p){
    return {open:p, high:p, low:p, close:p}
}

// стартовая история
function generateHistory(){
    candles = []
    price = 100

    for(let i=0;i<40;i++){
        let open = price
        let close = open + (Math.random()-0.5)*2

        let high = Math.max(open, close) + Math.random()*1
        let low = Math.min(open, close) - Math.random()*1

        candles.push({open, high, low, close})
        price = close
    }

    current = newCandle(price)
}

// движение
function tick(){
    price += (Math.random()-0.5)*0.6

    current.high = Math.max(current.high, price)
    current.low = Math.min(current.low, price)
    current.close = price
}

// новая свеча
setInterval(()=>{
    if(!current) return

    candles.push(current)
    if(candles.length > 60) candles.shift()

    current = newCandle(price)
},2000)

// рисование
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height)

    let all = [...candles, current].filter(Boolean)
    if(all.length < 2) return

    let max = Math.max(...all.map(c=>c.high))
    let min = Math.min(...all.map(c=>c.low))

    let range = max - min
    if(range < 2) range = 2

    let w = canvas.width / all.length

    all.forEach((c,i)=>{

        let x = i*w
        let scale = canvas.height / range

        let o = canvas.height-(c.open-min)*scale
        let cl = canvas.height-(c.close-min)*scale
        let hi = canvas.height-(c.high-min)*scale
        let lo = canvas.height-(c.low-min)*scale

        // тень
        ctx.strokeStyle="#94a3b8"
        ctx.beginPath()
        ctx.moveTo(x+w/2,hi)
        ctx.lineTo(x+w/2,lo)
        ctx.stroke()

        // тело
        ctx.fillStyle = c.close>c.open ? "#22c55e" : "#ef4444"

        ctx.fillRect(
            x+w*0.25,
            Math.min(o,cl),
            w*0.5,
            Math.abs(o-cl) || 2
        )
    })

    // линия входа
    let entryY = canvas.height - ((entry - min)/range)*canvas.height

    ctx.strokeStyle="#38bdf8"
    ctx.setLineDash([5,5])

    ctx.beginPath()
    ctx.moveTo(0, entryY)
    ctx.lineTo(canvas.width, entryY)
    ctx.stroke()

    ctx.setLineDash([])
}

// ===== TRADE
let loop = null
let timeLeft = 0

function startTrade(){

    generateHistory()

    entry = price
    timeLeft = active.time

    if(loop) clearInterval(loop)

    loop = setInterval(()=>{

        tick()
        draw()

        let profit = price - entry

        document.getElementById("timer").innerText =
            "Time: " + timeLeft

        document.getElementById("profit").innerText =
            "P/L: " + profit.toFixed(2)

        document.getElementById("profit").className =
            profit>=0 ? "green" : "red"

        let box = document.querySelector(".chart-box")
        box.classList.remove("glow-green","glow-red")

        if(profit > 0) box.classList.add("glow-green")
        else box.classList.add("glow-red")

        timeLeft--

        if(timeLeft<=0){
            clearInterval(loop)
        }

    },150)
}

</script>

</body>
</html>
