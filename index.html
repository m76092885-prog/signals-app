<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cyber Signals</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at top,
    #111827,
    #05070d);

    color:white;

    font-family:monospace;

    overflow:hidden;
}

/* ===== MAIN ===== */

#main{

    width:100%;
    height:100vh;

    overflow-y:auto;

    padding:20px;
}

.title{

    color:#ff4dff;

    font-size:26px;

    margin-bottom:20px;

    text-shadow:
    0 0 10px #ff4dff;
}

/* ===== SIGNAL ===== */

.signal{

    background:
    rgba(20,20,40,0.75);

    border:
    1px solid rgba(255,0,255,0.2);

    border-radius:16px;

    padding:18px;

    margin-bottom:14px;

    transition:0.2s;

    cursor:pointer;
}

.signal:hover{

    transform:scale(1.02);

    box-shadow:
    0 0 20px rgba(255,0,255,0.3);
}

.buy{
    color:#ff4dff;
}

.sell{
    color:#ff2a6d;
}

/* ===== CHART ===== */

#tradeScreen{

    display:none;

    width:100%;
    height:100vh;
}

/* ===== CHART WINDOW ===== */

#chartBox{

    position:fixed;

    top:10px;
    left:10px;
    right:10px;

    height:52vh;

    border-radius:18px;

    overflow:hidden;

    background:#05070d;

    border:
    1px solid rgba(255,0,255,0.2);

    box-shadow:
    0 0 25px rgba(255,0,255,0.15);
}

/* ===== INFO ===== */

#infoBox{

    position:fixed;

    bottom:10px;
    left:10px;
    right:10px;

    height:40vh;

    border-radius:18px;

    padding:20px;

    background:
    rgba(10,10,30,0.95);

    border:
    1px solid rgba(255,0,255,0.2);
}

.infoTitle{

    font-size:24px;

    color:#00c8ff;

    margin-bottom:12px;
}

.info{
    margin-top:10px;
    font-size:18px;
}

.green{
    color:#00c8ff;
}

.red{
    color:#ff2a6d;
}

/* ===== BUTTON ===== */

.back{

    margin-top:20px;

    padding:14px;

    border-radius:14px;

    text-align:center;

    cursor:pointer;

    background:
    rgba(20,20,40,0.8);

    border:
    1px solid rgba(255,0,255,0.2);
}

</style>
</head>

<body>

<!-- ===== SIGNALS ===== -->

<div id="main">

    <div class="title">
        CYBER SIGNALS
    </div>

    <div
    class="signal"
    onclick="openTrade('BTCUSDT','BUY')"
    >
        <div>BTC/USDT</div>
        <div class="buy">BUY</div>
    </div>

    <div
    class="signal"
    onclick="openTrade('ETHUSDT','SELL')"
    >
        <div>ETH/USDT</div>
        <div class="sell">SELL</div>
    </div>

    <div
    class="signal"
    onclick="openTrade('EURUSD','BUY')"
    >
        <div>EUR/USD</div>
        <div class="buy">BUY</div>
    </div>

</div>

<!-- ===== TRADE SCREEN ===== -->

<div id="tradeScreen">

    <div id="chartBox"></div>

    <div id="infoBox">

        <div
        id="pair"
        class="infoTitle"
        ></div>

        <div
        id="signalText"
        class="info"
        ></div>

        <div
        id="priceText"
        class="info"
        ></div>

        <div
        id="statusText"
        class="info"
        ></div>

        <div
        class="back"
        onclick="goBack()"
        >
            ← BACK
        </div>

    </div>

</div>

<script>

// ===== UI =====

const main=
document.getElementById("main")

const tradeScreen=
document.getElementById("tradeScreen")

const pairEl=
document.getElementById("pair")

const signalText=
document.getElementById("signalText")

const priceText=
document.getElementById("priceText")

const statusText=
document.getElementById("statusText")

// ===== CHART =====

let chart
let candleSeries
let ws

// ===== OPEN =====

function openTrade(symbol,dir){

    main.style.display="none"

    tradeScreen.style.display="block"

    pairEl.innerText=symbol

    signalText.innerHTML=
    `
    Signal:
    <span class="${
        dir==="BUY"
        ? "buy"
        : "sell"
    }">
        ${dir}
    </span>
    `

    createChart()

    connect(symbol)
}

// ===== BACK =====

function goBack(){

    tradeScreen.style.display="none"

    main.style.display="block"

    if(ws){
        ws.close()
    }

    if(chart){
        chart.remove()
    }
}

// ===== CREATE CHART =====

function createChart(){

    document.getElementById(
        "chartBox"
    ).innerHTML=""

    chart=
    LightweightCharts.createChart(

        document.getElementById(
            "chartBox"
        ),

        {

            width:
            document.getElementById(
                "chartBox"
            ).clientWidth,

            height:
            document.getElementById(
                "chartBox"
            ).clientHeight,

            layout:{

                background:{
                    color:"#05070d"
                },

                textColor:"#888"
            },

            grid:{

                vertLines:{
                    color:"rgba(0,200,255,0.05)"
                },

                horzLines:{
                    color:"rgba(0,200,255,0.05)"
                }
            },

            crosshair:{
                mode:1
            },

            rightPriceScale:{
                borderColor:"#222"
            },

            timeScale:{
                borderColor:"#222"
            }
        }
    )

    candleSeries=
    chart.addCandlestickSeries({

        upColor:"#ff4dff",

        downColor:"#ff2a6d",

        borderVisible:false,

        wickUpColor:"#00c8ff",

        wickDownColor:"#ff2a6d"
    })
}

// ===== REALTIME =====

function connect(symbol){

    // BINANCE WS

    ws=new WebSocket(

    `wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_1m`

    )

    ws.onmessage=(event)=>{

        const data=
        JSON.parse(event.data)

        const k=data.k

        candleSeries.update({

            time:k.t/1000,

            open:parseFloat(k.o),

            high:parseFloat(k.h),

            low:parseFloat(k.l),

            close:parseFloat(k.c)
        })

        priceText.innerHTML=
        `
        Price:
        <span class="green">
            ${k.c}
        </span>
        `

        let pnl=
        (
            parseFloat(k.c)-
            parseFloat(k.o)
        ).toFixed(2)

        statusText.innerHTML=
        `
        Candle:
        <span class="${
            pnl>=0
            ? "green"
            : "red"
        }">
            ${pnl}
        </span>
        `
    }
}

</script>

</body>
</html>
