<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signals Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #000;
    color: #fff;
}

/* ===== АНИМИРОВАННЫЙ ФОН ===== */
.bg {
    position: fixed;
    width: 200%;
    height: 200%;
    background: linear-gradient(120deg, #0f172a, #020617, #0f172a);
    animation: moveBg 20s linear infinite;
    filter: blur(20px);
    z-index: 0;
}

@keyframes moveBg {
    0% { transform: translate(0,0); }
    50% { transform: translate(-25%, -25%); }
    100% { transform: translate(0,0); }
}

/* ===== СВЕЧИ (ФЕЙК) ===== */
.candles {
    position: fixed;
    width: 100%;
    height: 100%;
    opacity: 0.15;
    z-index: 0;
}

.candle {
    position: absolute;
    bottom: 0;
    width: 4px;
    background: #00ff9d;
    animation: grow 2s infinite;
}

@keyframes grow {
    0% { height: 10px; }
    50% { height: 100px; }
    100% { height: 20px; }
}

/* ===== ОСНОВА ===== */
.container {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 20px;
}

/* ===== СТАТИСТИКА ===== */
.stats {
    text-align: center;
    margin-top: 20px;
    margin-bottom: 20px;
    font-size: 16px;
}

/* ===== КНОПКИ ===== */
.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
}

button {
    width: 80%;
    padding: 14px;
    border-radius: 20px;
    border: none;
    font-size: 16px;
    background: rgba(255,255,255,0.1);
    color: white;
    backdrop-filter: blur(10px);
}

/* ===== СИГНАЛЫ ===== */
.signals {
    margin-top: 10px;
    max-height: 50vh;
    overflow-y: auto;
}

.signal {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
}

.buy { color: #00ff9d; }
.sell { color: #ff4d4d; }

.prob {
    font-size: 14px;
}

.time {
    font-size: 11px;
    opacity: 0.6;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="candles" id="candles"></div>

<div class="container">

    <div class="stats">
        📊 Последние 10 сделок: <span id="stat">--</span>
    </div>

    <div class="buttons">
        <button onclick="loadSignals()">🔄 Обновить</button>
        <button>🚀 Авто режим</button>
    </div>

    <div class="signals" id="signals"></div>

</div>

<script>
// ===== ФЕЙК СВЕЧИ =====
const candleContainer = document.getElementById("candles");
for (let i = 0; i < 40; i++) {
    const c = document.createElement("div");
    c.className = "candle";
    c.style.left = Math.random() * 100 + "%";
    c.style.animationDelay = Math.random() * 2 + "s";
    candleContainer.appendChild(c);
}

// ===== СИГНАЛЫ =====
async function loadSignals() {
    const res = await fetch("/signals");
    const data = await res.json();

    const container = document.getElementById("signals");
    container.innerHTML = "";

    let wins = 0;

    data.slice(-10).forEach(s => {
        if (s.probability > 70) wins++;
    });

    document.getElementById("stat").innerText =
        Math.round((wins / 10) * 100) + "%";

    data.reverse().forEach(s => {
        const el = document.createElement("div");
        el.className = "signal";

        const side = s.signal === "BUY" ? "buy" : "sell";

        el.innerHTML = `
            <div>
                <b>${s.symbol}</b><br>
                <span class="${side}">${s.signal}</span>
            </div>
            <div style="text-align:right">
                <div class="prob">${s.probability}%</div>
                <div class="time">${new Date(s.time * 1000).toLocaleTimeString()}</div>
            </div>
        `;

        container.appendChild(el);
    });
}

setInterval(loadSignals, 2000);
loadSignals();
</script>

</body>
</html>
