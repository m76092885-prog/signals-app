<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Futures Scanner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background: radial-gradient(circle at top,#1a0025,#05000a);
    color:white;
    overflow-x:hidden;
}

.screen{
    display:none;
    width:100%;
    min-height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:20px;
}

.active{
    display:flex;
}

/* PANEL */
.panel{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.04);
    border-radius:25px;
    padding:25px;
    border:1px solid rgba(255,0,180,0.2);
}

/* TITLE */
.title{
    text-align:center;
    font-size:26px;
    font-weight:800;
    color:#ff4fd8;
    margin-bottom:20px;
}

/* BUTTON */
.btn{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(90deg,#ff4fd8,#7a5cff);
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

.btn:active{
    transform:scale(0.97);
}

/* SELECT */
select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,0.05);
    color:white;
}

/* CHECKBOX */
.option{
    margin-top:15px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.option input{
    width:20px;
    height:20px;
}

/* LOADING */
.loader{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid #ff4fd8;
    border-top:4px solid transparent;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* SIGNAL */
.signalBox{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.05);
    border-radius:25px;
    padding:20px;
}

.side{
    font-size:28px;
    font-weight:800;
    margin-bottom:10px;
}

.buy{color:#00ff9d;}
.sell{color:#ff4d6d;}

.metric{
    margin-top:10px;
    font-size:16px;
}

/* BACK BUTTON */
.backBtn{
    margin-top:25px;
    width:120px;
    padding:10px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.5);
    font-size:12px;
    cursor:pointer;
}

/* animation tap */
button:active{
    transform:scale(0.97);
}

</style>

</head>

<body>

<!-- HOME -->
<div class="screen active" id="home">

    <div class="panel">

        <div class="title">
            AI FUTURES SCANNER
        </div>

        <button class="btn" onclick="show('settings')">
            GET SIGNAL
        </button>

    </div>

</div>

<!-- SETTINGS -->
<div class="screen" id="settings">

    <div class="panel">

        <div class="title">
            SETTINGS
        </div>

        <select id="asset">
            <option>CC1!</option>
        </select>

        <select id="timeframe">
            <option value="3m">3 MIN</option>
            <option value="5m">5 MIN</option>
            <option value="15m">15 MIN</option>
        </select>

        <div class="option">
            <input type="checkbox" id="trendOnly">
            <label>ONLY TREND TRADES</label>
        </div>

        <button class="btn" onclick="startScan()">
            START SCAN
        </button>

        <button class="backBtn" onclick="show('home')">
            BACK
        </button>

    </div>

</div>

<!-- SCANNING -->
<div class="screen" id="scan">

    <div class="loader"></div>
    <div style="margin-top:20px;opacity:0.7;">
        SEARCHING SIGNAL...
    </div>

</div>

<!-- SIGNAL -->
<div class="screen" id="signal">

    <div class="signalBox">

        <div class="title">
            ELITE ENTRY
        </div>

        <div class="side" id="side"></div>

        <div class="metric" id="assetText"></div>
        <div class="metric" id="entry"></div>
        <div class="metric" id="sl"></div>
        <div class="metric" id="tp"></div>
        <div class="metric" id="conf"></div>

        <div class="metric" id="reasons"></div>

        <button class="backBtn" onclick="show('home')">
            BACK
        </button>

    </div>

</div>

<script>

const API = "https://signals-ai-engine.onrender.com"

function show(id){

    document.querySelectorAll(".screen")
    .forEach(s => s.classList.remove("active"))

    document.getElementById(id)
    .classList.add("active")
}

async function startScan(){

    show("scan")

    const asset = document.getElementById("asset").value
    const tf = document.getElementById("timeframe").value
    const trend = document.getElementById("trendOnly").checked

    while(true){

        const res = await fetch(`${API}/signal`)
        const data = await res.json()

        if(data.status === "SEARCHING"){
            await new Promise(r => setTimeout(r, 2500))
            continue
        }

        if(data.side){

            showSignal(data)
            return
        }

        await new Promise(r => setTimeout(r, 2500))
    }
}

function showSignal(data){

    show("signal")

    document.getElementById("side").innerText = data.side
    document.getElementById("side").className = "side " + (data.side === "BUY" ? "buy" : "sell")

    document.getElementById("assetText").innerText = "ASSET: " + data.asset
    document.getElementById("entry").innerText = "ENTRY: " + data.entry
    document.getElementById("sl").innerText = "SL: " + data.sl
    document.getElementById("tp").innerText = "TP1: " + data.tp1 + " | TP2: " + data.tp2
    document.getElementById("conf").innerText = data.confidence + "% SUCCESS"

    let r = ""
    data.reasons.forEach(x => r += "• " + x + "<br>")

    document.getElementById("reasons").innerHTML = r
}

</script>

</body>
</html>
