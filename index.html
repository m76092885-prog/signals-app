<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:monospace;
    background:#0d1117;
    color:white;
    overflow:hidden;
    transition:0.4s;
}

/* ===== BACKGROUND GRADIENT ===== */
#bg{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
    filter:blur(80px);
}

/* ===== GLASS CARD ===== */
.card{
    width:90%;
    max-width:400px;
    margin:auto;
    margin-top:100px;
    padding:20px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);

    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);

    box-shadow:0 0 30px rgba(0,255,200,0.1);

    text-align:center;
    touch-action:none;
}

/* ===== PAIR ===== */
.pair{
    font-size:22px;
    margin-bottom:10px;
}

/* ===== BUTTON ===== */
.btn{
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:#111;
    cursor:pointer;
}

/* ===== GAUGE ===== */
#gauge{
    width:200px;
    height:100px;
    margin:auto;
}

canvas{
    width:100%;
}

/* ===== DASH ===== */
#dashboard{
    position:absolute;
    top:10px;
    left:10px;
    font-size:14px;
    opacity:0.7;
}

</style>
</head>

<body>

<div id="bg"></div>

<div id="dashboard">
Winrate (24h): <span id="wr">78%</span>
</div>

<div id="card" class="card">

    <div class="pair" id="pair">EUR/USD</div>

    <canvas id="gauge"></canvas>

    <div id="signal">BUY</div>

    <div class="btn" onclick="nextSignal()">Next</div>

</div>

<script>

// ===== DATA
let signals=[
    {pair:"EUR/USD",dir:"BUY",power:0.8},
    {pair:"BTC/USDT",dir:"SELL",power:0.3},
    {pair:"GBP/USD",dir:"BUY",power:0.6}
]

let i=0

// ===== RENDER
function nextSignal(){

    if(window.Telegram){
        Telegram.WebApp.HapticFeedback.impactOccurred("medium")
    }

    i++
    if(i>=signals.length) i=0

    render()
}

function render(){

    let s=signals[i]

    pair.innerText=s.pair
    signal.innerText=s.dir

    drawGauge(s.power)

    setMood(s.power)
}

render()

// ===== GAUGE (СПИДОМЕТР)
const g= document.getElementById("gauge")
const gctx = g.getContext("2d")

g.width=200
g.height=100

function drawGauge(power){

    gctx.clearRect(0,0,200,100)

    // дуга
    gctx.beginPath()
    gctx.arc(100,100,80,Math.PI,0)
    gctx.strokeStyle="#333"
    gctx.lineWidth=10
    gctx.stroke()

    // значение
    let angle = Math.PI + power*Math.PI

    // стрелка
    let x=100 + Math.cos(angle)*70
    let y=100 + Math.sin(angle)*70

    gctx.beginPath()
    gctx.moveTo(100,100)
    gctx.lineTo(x,y)
    gctx.strokeStyle="#00ffcc"
    gctx.lineWidth=3
    gctx.stroke()
}

// ===== MOOD
function setMood(power){

    let bg=document.getElementById("bg")

    if(power>0.7){
        bg.style.background="radial-gradient(#00ff99,#001)"
    }
    else if(power<0.3){
        bg.style.background="radial-gradient(#ff0033,#001)"
    }
    else{
        bg.style.background="radial-gradient(#00ccff,#001)"
    }
}

// ===== SWIPE (TINDER)
let startX=0

card.addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX
})

card.addEventListener("touchend",e=>{
    let dx=e.changedTouches[0].clientX - startX

    if(dx>50){
        nextSignal()
    }
    if(dx<-50){
        nextSignal()
    }
})

</script>

</body>
</html>
