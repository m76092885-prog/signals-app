<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
body{
    margin:0;
    background:#0b0f1a;
    color:white;
    font-family:Arial;
}

.trade-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:95%;
    height:85%;
    background:#0f172a;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

#chart{
    flex:1;
}

.panel{
    height:80px;
    background:#020617;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.btn{
    padding:12px 30px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

.buy{ background:#16a34a }
.sell{ background:#dc2626 }

</style>
</head>

<body>

<div class="trade-box">
    <div id="chart"></div>

    <div class="panel">
        <div class="btn buy">CALL</div>
        <div id="price">0.0000</div>
        <div class="btn sell">PUT</div>
    </div>
</div>

<script>

const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0f172a' }, textColor: '#aaa' },
    grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
    timeScale: { timeVisible: true, secondsVisible: true },
})

const candleSeries = chart.addCandlestickSeries()

// 🔥 ВАЖНО: база времени
let baseTime = Math.floor(Date.now() / 1000)

// 🔌 WS
const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host + "/ws"
)

ws.onmessage = (e)=>{

    const data = JSON.parse(e.data)

    document.getElementById("price").innerText = data.price

    if(!data.candles || data.candles.length === 0) return

    // 🔥 ДЕЛАЕМ НОРМАЛЬНЫЕ ВРЕМЕНА
    let time = baseTime - data.candles.length * 10

    const formatted = data.candles.map(c=>{
        time += 10
        return {
            time: time,
            open: c.open,
            high: c.high,
            low: c.low,
            close: c.close
        }
    })

    candleSeries.setData(formatted)
}

</script>

</body>
</html>
