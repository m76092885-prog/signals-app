<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#020617;
    color:#fff;
    font-family:Arial;
}

.container{
    padding:15px;
}

.signal{
    background:#111827;
    margin-bottom:10px;
    padding:15px;
    border-radius:15px;
}
.signal:active{
    transform:scale(0.95);
}
</style>
</head>

<body>

<div class="container" id="signals"></div>

<script>

let signalsData = []

async function load(){
    try{
        let res = await fetch("/signals")
        signalsData = await res.json()

        let container = document.getElementById("signals")
        container.innerHTML=""

        signalsData.forEach((s,i)=>{
            let div = document.createElement("div")
            div.className = "signal"

            div.innerHTML = `
                <b>${s.symbol}</b><br>
                ${s.signal} (${s.probability}%)
            `

            // 🔥 НАДЁЖНЫЙ КЛИК
            div.onclick = function(){
                alert("ОТКРЫЛ: " + s.symbol + " " + s.signal)
            }

            container.appendChild(div)
        })

    }catch(e){
        console.log(e)
    }
}

setInterval(load,3000)
load()

</script>

</body>
</html>
