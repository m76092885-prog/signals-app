<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signals Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
    background:#020617;
    color:#fff;
    overflow:hidden;
}

/* 🔥 фикс кликов */
#bgChart, .overlay{
    pointer-events:none;
}

/* фон */
#bgChart{
    position:fixed;
    top:50%;
    left:50%;
    width:160%;
    height:160%;
    transform:translate(-50%,-50%);
    filter:blur(10px) brightness(0.5);
    z-index:0;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:radial-gradient(circle,transparent 30%,#020617 80%);
    z-index:1;
}

/* UI */
.container{
    position:relative;
    z-index:2;
    height:100vh;
    padding:15px;
    display:flex;
    flex-direction:column;
}

/* статистика */
.stats{
    text-align:center;
    margin-bottom:10px;
    opacity:0.8;
}

/* список */
.signals{
    flex:1;
    overflow:auto;
    padding-bottom:20px;
}

/* карточка */
.signal{
    background:rgba(15,23,42,0.85);
    margin-bottom:12px;
    padding:16px;
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:blur(6px);
    transition:0.2s;
}

.signal:active{
    transform:scale(0.97);
}

.buy{border-left:4px solid #22c55e}
.sell{border-left:4px solid #ef4444}

/* trade */
.trade{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#020617;
    z-index:10;
    display:none;
    flex-direction:column;
}

#tradeChart{
    height:60%;
}

.trade-info{
    padding:15px;
}

.btn{
    margin-top:12px;
    padding:14px;
    border-radius:25px;
    background:#1e293b;
    text-align:center;
}
</style>

</head>

<body>

<canvas id="bgChart"></canvas>

<div class="overlay"></div>

<div class="container">

```
<div class="stats">
    📊 Signals Live
</div>

<div id="signals" class="signals"></div>
```

</div>

<div id="trade" class="trade">

```
<canvas id="tradeChart"></canvas>

<div class="trade-info">
    <div id="pair"></div>
    <div id="status"></div>
    <div id="timer"></div>

    <div class="btn" id="backBtn">Назад</div>
</div>
```

</div>

<script>

// ===== TELEGRAM =====
if (window.Telegram && Telegram.WebApp){
    Telegram.WebApp.expand()
}

// ===== BACKGROUND =====
const bg = document.getElementById("bgChart")
const ctx = bg.getContext("2d")

bg.width = window.innerWidth * 1.5
bg.height = window.innerHeight * 1.5

let candles=[]
let price=100

function gen(){
    let open=price
    let close=open+(Math.random()-0.5)*2
    let high=Math.max(open,close)+Math.random()
    let low=Math.min(open,close)-Math.random()
    price=close
    return {open,close,high,low}
}

for(let i=0;i<80;i++) candles.push(gen())

let offset=0

function draw(){
    ctx.clearRect(0,0,bg.width,bg.height)

    const w=10,g=4
    const max=Math.max(...candles.map(c=>c.high))
    const min=Math.min(...candles.map(c=>c.low))
    const scale=bg.height/(max-min)

    candles.forEach((c,i)=>{
        let x=i*(w+g)-offset
        let o=bg.height-(c.open-min)*scale
        let cl=bg.height-(c.close-min)*scale
        let h=bg.height-(c.high-min)*scale
        let l=bg.height-(c.low-min)*scale

        let col=c.close>c.open?"#22c55e":"#ef4444"

        ctx.strokeStyle=col
        ctx.beginPath()
        ctx.moveTo(x+w/2,h)
        ctx.lineTo(x+w/2,l)
        ctx.stroke()

        ctx.fillStyle=col
        ctx.fillRect(x,Math.min(o,cl),w,Math.abs(o-cl))
    })
}

setInterval(()=>{
    offset+=1.2
    if(offset>14){
        offset=0
        candles.push(gen())
        candles.shift()
    }
    draw()
},16)

// ===== SIGNALS =====
let signalsData=[]

async function load(){
    try{
        let res=await fetch("https://signals-app-yk11.onrender.com/signals")
        signalsData=await res.json()

        let container=document.getElementById("signals")
        container.innerHTML=""

        signalsData.reverse().forEach((s,i)=>{
            let div=document.createElement("div")
            div.className="signal "+(s.signal=="BUY"?"buy":"sell")
            div.dataset.index=i

            div.innerHTML=`
                <div>
                    <b>${s.symbol}</b><br>${s.signal}
                </div>
                <div>${s.probability}%</div>
            `

            container.appendChild(div)
        })

    }catch(e){
        console.log(e)
    }
}

setInterval(load,3000)
load()

// ===== 🔥 КЛИК ФИКС =====
const container = document.getElementById("signals")

function handle(e){
    let el = e.target.closest(".signal")
    if(!el) return

    let index = el.dataset.index
    let signal = signalsData.reverse()[index]

    openTrade(signal)
}

container.addEventListener("click", handle)
container.addEventListener("touchstart", handle)

// ===== TRADE =====
let trade=null

const tcanvas=document.getElementById("tradeChart")
const tctx=tcanvas.getContext("2d")

tcanvas.width=window.innerWidth
tcanvas.height=window.innerHeight*0.6

function openTrade(s){
    trade=s
    document.getElementById("trade").style.display="flex"
    document.getElementById("pair").innerText=s.symbol+" "+s.signal
    runTrade()
}

document.getElementById("backBtn").addEventListener("click", ()=>{
    document.getElementById("trade").style.display="none"
})

function runTrade(){
    let entry=100
    let current=entry
    let start=Date.now()

    let interval=setInterval(()=>{
        tctx.clearRect(0,0,tcanvas.width,tcanvas.height)

        current += (Math.random()-0.5)*0.002

        let profit =
            (trade.signal=="BUY" && current>entry) ||
            (trade.signal=="SELL" && current<entry)

        // линия входа
        tctx.strokeStyle="#888"
        tctx.beginPath()
        tctx.moveTo(0,200)
        tctx.lineTo(tcanvas.width,200)
        tctx.stroke()

        // цена
        tctx.strokeStyle = profit ? "#22c55e" : "#ef4444"
        tctx.beginPath()
        tctx.moveTo(50,200)
        tctx.lineTo(300+(current-entry)*10000,200)
        tctx.stroke()

        document.getElementById("status").innerText =
            profit ? "🟢 В профите" : "🔴 В минусе"

        let left=180 - Math.floor((Date.now()-start)/1000)
        document.getElementById("timer").innerText="⏱ "+left+"s"

        if(left<=0) clearInterval(interval)

    },200)
}

</script>

</body>
</html>
