<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
AI Futures Sniper
</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    Inter,
    Arial,
    sans-serif;
}

body{

    background:
    radial-gradient(
        circle at top,
        #12203d,
        #050816 45%,
        #02040a 100%
    );

    color:white;

    width:100vw;
    height:100vh;

    overflow:hidden;
}

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(
        circle at 20% 20%,
        rgba(0,255,255,0.12),
        transparent 20%
    ),

    radial-gradient(
        circle at 80% 30%,
        rgba(0,255,255,0.07),
        transparent 20%
    ),

    radial-gradient(
        circle at 50% 80%,
        rgba(0,255,255,0.05),
        transparent 20%
    );

    animation:
    pulseBg 10s linear infinite;
}

@keyframes pulseBg{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }
}

.screen{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    padding:20px;

    z-index:2;
}

.active{

    display:flex;
}

.panel{

    width:430px;

    background:
    rgba(255,255,255,0.05);

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:
    blur(25px);

    border-radius:35px;

    padding:35px;

    box-shadow:

    0 0 60px rgba(0,255,255,0.12),

    inset 0 0 25px rgba(255,255,255,0.03);
}

.logo{

    font-size:42px;

    font-weight:800;

    text-align:center;

    letter-spacing:2px;

    color:#00ffee;

    text-shadow:

    0 0 20px #00ffee,

    0 0 40px #00ffee;

    margin-bottom:20px;
}

.subtitle{

    text-align:center;

    opacity:0.75;

    line-height:1.5;

    margin-bottom:40px;
}

.btn{

    width:100%;

    padding:20px;

    border:none;

    border-radius:22px;

    background:
    linear-gradient(
        90deg,
        #00ffee,
        #00bfff
    );

    color:#001018;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 0 30px rgba(0,255,255,0.35);
}

.btn:hover{

    transform:
    translateY(-2px)
    scale(1.02);

    box-shadow:
    0 0 45px rgba(0,255,255,0.5);
}

.select{

    width:100%;

    padding:18px;

    margin-top:18px;

    border:none;

    border-radius:20px;

    background:#0e1628;

    color:white;

    font-size:16px;

    outline:none;
}

.option{

    margin-top:25px;

    display:flex;

    align-items:center;

    gap:12px;

    opacity:0.85;
}

.radar{

    position:relative;

    width:220px;
    height:220px;

    border-radius:50%;

    border:
    5px solid rgba(0,255,255,0.3);

    box-shadow:

    0 0 40px rgba(0,255,255,0.4),

    inset 0 0 30px rgba(0,255,255,0.15);

    animation:
    rotateRadar 4s linear infinite;
}

.radar::before{

    content:"";

    position:absolute;

    inset:20px;

    border-radius:50%;

    border:
    2px solid rgba(0,255,255,0.25);
}

.radar::after{

    content:"";

    position:absolute;

    width:50%;
    height:3px;

    background:#00ffee;

    top:50%;
    left:50%;

    transform-origin:left center;

    animation:
    scanLine 2s linear infinite;

    box-shadow:
    0 0 20px #00ffee;
}

@keyframes rotateRadar{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes scanLine{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.scanText{

    margin-top:45px;

    font-size:28px;

    font-weight:700;

    color:#00ffee;

    text-shadow:
    0 0 20px #00ffee;
}

.scanChecks{

    margin-top:30px;

    display:flex;

    flex-direction:column;

    gap:12px;

    opacity:0.85;
}

.signalBox{

    width:520px;

    background:
    rgba(255,255,255,0.05);

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:
    blur(25px);

    border-radius:35px;

    padding:35px;

    box-shadow:
    0 0 60px rgba(0,255,255,0.15);
}

.signalHeader{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;
}

.signalTitle{

    font-size:34px;

    color:#00ffee;

    font-weight:800;
}

.badge{

    padding:12px 18px;

    border-radius:20px;

    font-weight:700;
}

.buy{

    background:
    rgba(0,255,120,0.15);

    color:#00ff88;

    box-shadow:
    0 0 20px rgba(0,255,120,0.25);
}

.sell{

    background:
    rgba(255,50,80,0.15);

    color:#ff3355;

    box-shadow:
    0 0 20px rgba(255,50,80,0.25);
}

.metric{

    margin-top:18px;

    font-size:20px;

    opacity:0.92;
}

.confidence{

    margin-top:25px;

    font-size:42px;

    color:#00ffee;

    font-weight:800;

    text-shadow:
    0 0 20px #00ffee;
}

.reasonBox{

    margin-top:30px;

    padding:20px;

    border-radius:20px;

    background:
    rgba(255,255,255,0.03);
}

.reason{

    margin-top:12px;

    opacity:0.85;
}

</style>

</head>

<body>

<div class="screen active"
id="homeScreen">

    <div class="panel">

        <div class="logo">

            AI FUTURES SNIPER

        </div>

        <div class="subtitle">

            The Most Powerful AI Futures Trading System

        </div>

        <button class="btn"
        onclick="showSettings()">

            GET SIGNAL

        </button>

    </div>

</div>

<div class="screen"
id="settingsScreen">

    <div class="panel">

        <div class="logo">

            SIGNAL SETTINGS

        </div>

        <select class="select"
        id="asset">

            <option>

                CC1!

            </option>

        </select>

        <select class="select"
        id="timeframe">

            <option value="3m">

                3 MIN

            </option>

            <option value="5m">

                5 MIN

            </option>

            <option value="15m">

                15 MIN

            </option>

        </select>

        <div class="option">

            <input type="checkbox"
            id="trendOnly">

            <label>

                ONLY TREND TRADES

            </label>

        </div>

        <button class="btn"
        style="margin-top:30px"
        onclick="startScan()">

            START AI SCAN

        </button>

    </div>

</div>

<div class="screen"
id="scanScreen">

    <div class="radar"></div>

    <div class="scanText">

        SCANNING MARKET STRUCTURE...

    </div>

    <div class="scanChecks">

        <div>

            ✔ Liquidity Sweep

        </div>

        <div>

            ✔ Volume Confirmation

        </div>

        <div>

            ✔ Momentum Analysis

        </div>

        <div>

            ✔ Smart Money Detection

        </div>

    </div>

</div>

<div class="screen"
id="signalScreen">

    <div class="signalBox">

        <div class="signalHeader">

            <div class="signalTitle">

                ELITE ENTRY

            </div>

            <div class="badge"
            id="sideBadge">

                BUY

            </div>

        </div>

        <div class="metric"
        id="assetText">

            ASSET: CC1!

        </div>

        <div class="metric"
        id="entry">

            ENTRY: 0

        </div>

        <div class="metric"
        id="sl">

            SL: 0

        </div>

        <div class="metric"
        id="tp">

            TP1: 0 | TP2: 0

        </div>

        <div class="confidence"
        id="confidence">

            84%

        </div>

        <div class="reasonBox"
        id="reasons">

        </div>

    </div>

</div>

<script>

const API =

"https://signals-ai-backend.onrender.com"

function show(id){

    document
    .querySelectorAll(".screen")
    .forEach(s =>

        s.classList.remove("active")

    )

    document
    .getElementById(id)
    .classList.add("active")
}

function showSettings(){

    show("settingsScreen")
}

async function startScan(){

    show("scanScreen")

    const asset =
    document
    .getElementById("asset")
    .value

    const timeframe =
    document
    .getElementById("timeframe")
    .value

    const trendOnly =
    document
    .getElementById("trendOnly")
    .checked

    const res =
    await fetch(

        API +

        "/signal?asset=" +

        asset +

        "&timeframe=" +

        timeframe +

        "&trend_only=" +

        trendOnly

    )

    const data =
    await res.json()

    showSignal(data)
}

function showSignal(data){

    show("signalScreen")

    const badge =
    document
    .getElementById("sideBadge")

    badge.innerText =
    data.side

    badge.className =
    "badge " +

    (
        data.side === "BUY"
        ? "buy"
        : "sell"
    )

    document
    .getElementById("assetText")
    .innerText =

    "ASSET: " +

    data.asset

    document
    .getElementById("entry")
    .innerText =

    "ENTRY: " +

    data.entry

    document
    .getElementById("sl")
    .innerText =

    "SL: " +

    data.sl

    document
    .getElementById("tp")
    .innerText =

    "TP1: " +

    data.tp1 +

    " | TP2: " +

    data.tp2

    document
    .getElementById("confidence")
    .innerText =

    data.confidence +

    "% SUCCESS"

    const reasons =
    document
    .getElementById("reasons")

    reasons.innerHTML = ""

    data.reasons.forEach(r => {

        reasons.innerHTML +=

        `<div class="reason">

            • ${r}

        </div>`
    })
}

</script>

</body>

</html>
