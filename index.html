<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signals Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    height: 100vh;
    overflow: hidden;
    color: white;
    background: black;
}

/* ===== ЖИВОЙ ГРАФИК ===== */
#chart {
    position: fixed;
    width: 100%;
    height: 100%;
    filter: blur(6px) brightness(0.35);
    z-index: 0;
}

/* ===== UI ===== */
.container {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 20px;
}

/* ===== СТАТИСТИКА ===== */
.stats {
    text-align: center;
    margin-top: 10px;
    margin-bottom: 15px;
    font-size: 16px;
}

/* ===== КНОПКИ ===== */
.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
}

button {
    width: 80%;
    padding: 14px;
    border-radius: 25px;
    border: none;
    font-size: 16px;
    background: rgba(255,255,255,0.12);
    color: white;
    backdrop-filter: blur(12px);
}

/* ===== СИГНАЛЫ ===== */
.signals {
    margin-top: 10px;
    max-height: 55vh;
    overflow-y: auto;
}

.signal {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
}

.buy { color: #00ff9d; }
.sell { color: #ff4d4d; }

.prob {
    font-size: 14px;
}

.time {
    font-size: 11px;
    opacity: 0.6;
}
</style>
</head>

<body>

<canvas id="chart"></canvas>

<div class="container">

    <div class="stats">
        📊 Winrate (10): <span id="stat">--</span>
    </div>

    <div class="buttons">
        <button onclick="loadSignals()">🔄 Обновить</button>
        <button>🚀 Авто режим</button>
    </div>

    <div class="signals" id="signals"></div>

</div>

<script>
/* ===== СВЕЧНОЙ ГРАФИК ===== */
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let candles = [];
let price = 100;

function generateCandle() {
    let open = price;
    let close = open + (Math.random() - 0.5) * 3;
    let high = Math.max(open, close) + Math.random() * 1.5;
    let low = Math.min(open, close) - Math.random() * 1.5;

    price = close;
    return { open, close, high, low };
}

for (let i = 0; i < 80; i++) candles.push(generateCandle());

function drawChart() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const w = 6;
    const gap = 3;

    const max = Math.max(...candles.map(c => c.high));
    const min = Math.min(...candles.map(c => c.low));
    const scale = canvas.height / (max - min);

    candles.forEach((c, i) => {
        const x = i * (w + gap);

        const openY = canvas.height - (c.open - min) * scale;
        const closeY = canvas.height - (c.close - min) * scale;
        const highY = canvas.height - (c.high - min) * scale;
        const lowY = canvas.height - (c.low - min) * scale;

        const color = c.close > c.open ? "#00ff9d" : "#ff4d4d";

        ctx.strokeStyle = color;
        ctx.fillStyle = color;

        // фитиль
        ctx.beginPath();
        ctx.moveTo(x + w/2, highY);
        ctx.lineTo(x + w/2, lowY);
        ctx.stroke();

        // тело
        ctx.fillRect(
            x,
            Math.min(openY, closeY),
            w,
            Math.abs(openY - closeY)
        );
    });
}

function updateChart() {
    candles.push(generateCandle());
    if (candles.length > 100) candles.shift();
    drawChart();
}

setInterval(updateChart, 700);

/* ===== СИГНАЛЫ ===== */
async function loadSignals() {
    const res = await fetch("/signals");
    const data = await res.json();

    const container = document.getElementById("signals");
    container.innerHTML = "";

    let wins = 0;

    data.slice(-10).forEach(s => {
        if (s.probability > 70) wins++;
    });

    document.getElementById("stat").innerText =
        Math.round((wins / 10) * 100) + "%";

    data.reverse().forEach(s => {
        const el = document.createElement("div");
        el.className = "signal";

        const side = s.signal === "BUY" ? "buy" : "sell";

        el.innerHTML = `
            <div>
                <b>${s.symbol}</b><br>
                <span class="${side}">${s.signal}</span>
            </div>
            <div style="text-align:right">
                <div class="prob">${s.probability}%</div>
                <div class="time">${new Date(s.time * 1000).toLocaleTimeString()}</div>
            </div>
        `;

        container.appendChild(el);
    });
}

setInterval(loadSignals, 2000);
loadSignals();
</script>

</body>
</html>
