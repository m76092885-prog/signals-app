<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#020617;
    color:#fff;
    font-family:Arial;
    overflow:hidden;
}

/* ===== ФОН ===== */
#bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    filter:blur(12px) brightness(0.5);
    z-index:0;
}

/* ===== СПИСОК ===== */
.container{
    position:relative;
    z-index:2;
    padding:15px;
    height:100vh;
    overflow:auto;
}

.signal{
    background:rgba(17,24,39,0.85);
    margin-bottom:10px;
    padding:16px;
    border-radius:18px;
    backdrop-filter:blur(8px);
    cursor:pointer;
}

/* ===== ПЛАВАЮЩАЯ КАРТА ГРАФИКА ===== */
.trade{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:92%;
    height:70%;
    background:rgba(15,23,42,0.92);
    border-radius:26px;
    backdrop-filter:blur(18px);
    display:none;
    flex-direction:column;
    z-index:10;
    overflow:hidden;
    box-shadow:0 0 50px rgba(0,0,0,0.6);
}

/* график */
#chart{
    width:100%;
    height:65%;
    background:linear-gradient(180deg,#0b1220,#0a0f1d);
}

/* инфо */
.info{
    padding:15px;
}

.btn{
    margin-top:10px;
    padding:14px;
    background:#1e293b;
    border-radius:18px;
    text-align:center;
}

/* ===== СВЕЧЕНИЕ ===== */
.trade.glow-green{
    box-shadow:0 0 120px rgba(34,197,94,0.25), 0 0 40px rgba(34,197,94,0.15);
}

.trade.glow-red{
    box-shadow:0 0 120px rgba(239,68,68,0.25), 0 0 40px rgba(239,68,68,0.15);
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container" id="signals"></div>

<div class="trade" id="trade">
    <canvas id="chart"></canvas>

    <div class="info">
        <div id="pair"></div>
        <div id="status"></div>
        <div id="timer"></div>
        <div id="reason"></div>

        <div class="btn" onclick="closeTrade()">Назад</div>
    </div>
</div>

<script>

/////////////////////////////////////////////////////
// 🌌 ФОН
/////////////////////////////////////////////////////

const bg = document.getElementById("bg")
const bctx = bg.getContext("2d")

bg.width = window.innerWidth
bg.height = window.innerHeight

let bgCandles = []

function newCandle(prev){
    let open = prev ? prev.close : 100
    let close = open + (Math.random()-0.5)*0.4
    let high = Math.max(open,close) + Math.random()*0.3
    let low = Math.min(open,close) - Math.random()*0.3
    return {open,close,high,low}
}

for(let i=0;i<80;i++){
    bgCandles.push(newCandle(bgCandles[i-1]))
}

function drawBG(){

    bctx.clearRect(0,0,bg.width,bg.height)

    bgCandles.push(newCandle(bgCandles[bgCandles.length-1]))
    bgCandles.shift()

    let w = bg.width / bgCandles.length
    let mid = bg.height/2

    bgCandles.forEach((c,i)=>{

        let x = i*w
        let scale = 6

        let o = mid - (c.open-100)*scale
        let cl = mid - (c.close-100)*scale
        let h = mid - (c.high-100)*scale
        let l = mid - (c.low-100)*scale

        bctx.strokeStyle = "rgba(255,255,255,0.15)"
        bctx.beginPath()
        bctx.moveTo(x+w/2,h)
        bctx.lineTo(x+w/2,l)
        bctx.stroke()

        bctx.fillStyle = c.close > c.open
            ? "rgba(34,197,94,0.25)"
            : "rgba(239,68,68,0.25)"

        let y = Math.min(o,cl)
        let height = Math.abs(o-cl)

        bctx.fillRect(x,y,w*0.6,height || 1)
    })
}

setInterval(drawBG,120)

/////////////////////////////////////////////////////
// 📊 СИГНАЛЫ
/////////////////////////////////////////////////////

let signalsData=[]

async function load(){
    let res = await fetch("/signals")
    signalsData = await res.json()

    let c = document.getElementById("signals")
    c.innerHTML=""

    signalsData.forEach(s=>{

        let div = document.createElement("div")
        div.className="signal"

        div.innerHTML = `
            <b>${s.symbol}</b><br>
            ${s.signal} (${s.probability}%)
        `

        div.onclick = ()=> openTrade(s)

        c.appendChild(div)
    })
}

setInterval(load,3000)
load()

/////////////////////////////////////////////////////
// 📈 СДЕЛКА
/////////////////////////////////////////////////////

const canvas = document.getElementById("chart")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight * 0.6

let trade = null
let candles = []

function newTradeCandle(prev){
    let open = prev ? prev.close : 100
    let close = open + (Math.random()-0.5)*0.2
    let high = Math.max(open,close) + Math.random()*0.2
    let low = Math.min(open,close) - Math.random()*0.2
    return {open,close,high,low}
}

function openTrade(s){

    trade = s
    document.getElementById("trade").style.display="flex"
    document.getElementById("trade").classList.remove("glow-green","glow-red")

    document.getElementById("pair").innerText =
        s.symbol + " | " + s.signal

    document.getElementById("reason").innerText =
        "RSI + EMA + импульс"

    startTrade()
}

function closeTrade(){
    document.getElementById("trade").style.display="none"
}

/////////////////////////////////////////////////////
// 🚀 ГРАФИК
/////////////////////////////////////////////////////

function startTrade(){

    candles=[]

    for(let i=0;i<70;i++){
        candles.push(newTradeCandle(candles[i-1]))
    }

    let entry = candles[candles.length-1].close
    let start = Date.now()

    function animate(){

        ctx.clearRect(0,0,canvas.width,canvas.height)

        candles.push(newTradeCandle(candles[candles.length-1]))
        if(candles.length > 90) candles.shift()

        let w = canvas.width / candles.length
        let mid = canvas.height/2
        let scale = 18

        candles.forEach((c,i)=>{

            let x = i*w

            let o = mid - (c.open-entry)*scale
            let cl = mid - (c.close-entry)*scale
            let h = mid - (c.high-entry)*scale
            let l = mid - (c.low-entry)*scale

            ctx.strokeStyle = "rgba(255,255,255,0.2)"
            ctx.beginPath()
            ctx.moveTo(x+w/2,h)
            ctx.lineTo(x+w/2,l)
            ctx.stroke()

            ctx.fillStyle = c.close > c.open
                ? "#22c55e"
                : "#ef4444"

            let y = Math.min(o,cl)
            let height = Math.abs(o-cl)

            ctx.fillRect(x,y,w*0.6,height || 1)
        })

        ctx.strokeStyle="rgba(255,255,255,0.25)"
        ctx.beginPath()
        ctx.moveTo(0,mid)
        ctx.lineTo(canvas.width,mid)
        ctx.stroke()

        let last = candles[candles.length-1].close

        let profit =
            (trade.signal=="BUY" && last > entry) ||
            (trade.signal=="SELL" && last < entry)

        // 🔥 СВЕЧЕНИЕ
        let box = document.getElementById("trade")
        box.classList.remove("glow-green","glow-red")

        if(profit){
            box.classList.add("glow-green")
        }else{
            box.classList.add("glow-red")
        }

        document.getElementById("status").innerText =
            profit ? "🟢 В профите" : "🔴 В минусе"

        let left = 60 - (Date.now()-start)/1000
        document.getElementById("timer").innerText =
            "⏱ " + left.toFixed(1) + " сек"

        if(left > 0){
            requestAnimationFrame(animate)
        }
    }

    animate()
}

</script>

</body>
</html>
