<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    background:#070b14;
    color:white;
    font-family:monospace;
}

/* ===== SIGNALS ===== */
#main{
    padding:20px;
}

.title{
    color:#ff4dff;
    font-size:22px;
    margin-bottom:10px;
}

.signal{
    padding:15px;
    margin-bottom:10px;

    background:#111827;
    border-radius:12px;

    border:1px solid rgba(255,0,255,0.2);

    cursor:pointer;
    transition:.2s;
}

.signal:hover{
    transform:scale(1.02);
    box-shadow:0 0 15px rgba(255,0,255,0.4);
}

/* ===== WINDOWS ===== */
.window{
    position:fixed;
    left:10px;
    right:10px;
    border-radius:16px;
}

/* ===== CHART ===== */
#chartWindow{
    top:10px;
    height:50vh;

    background:
    linear-gradient(#05070d,#05070d),
    repeating-linear-gradient(
        0deg,
        rgba(0,200,255,0.05) 0px,
        rgba(0,200,255,0.05) 1px,
        transparent 1px,
        transparent 30px
    ),
    repeating-linear-gradient(
        90deg,
        rgba(0,200,255,0.05) 0px,
        rgba(0,200,255,0.05) 1px,
        transparent 1px,
        transparent 30px
    );
}

/* ===== INFO ===== */
#infoWindow{
    bottom:10px;
    height:40vh;
    padding:15px;

    background:#0b1020;

    display:flex;
    flex-direction:column;

    border:1px solid rgba(255,0,255,0.2);
}

/* ===== TEXT ===== */
.green{
    color:#00c8ff;
}

.red{
    color:#ff2a6d;
}

/* ===== BUTTON ===== */
.back{
    margin-top:10px;
    padding:12px;

    background:#111;
    border-radius:10px;

    text-align:center;

    cursor:pointer;
}

/* ===== CANVAS ===== */
canvas{
    width:100%;
    height:100%;
    touch-action:none;
}

</style>
</head>

<body>

<!-- SIGNALS -->
<div id="main">
    <div class="title">Signals</div>

    <div class="signal" onclick="openTrade('BTC/USDT','BUY')">
        BTC/USDT<br>
        <span style="color:#ff4dff">BUY</span>
    </div>

    <div class="signal" onclick="openTrade('ETH/USDT','SELL')">
        ETH/USDT<br>
        <span style="color:#ff2a6d">SELL</span>
    </div>
</div>

<!-- CHART -->
<div id="chartWindow" class="window" style="display:none">
    <canvas id="chart"></canvas>
</div>

<!-- INFO -->
<div id="infoWindow" class="window" style="display:none">

    <div id="pair"></div>
    <div id="priceText"></div>

    <div class="back" onclick="goBack()">← Назад</div>

</div>

<script>

// ===== WS
let socket = new WebSocket("ws://127.0.0.1:8000/ws")

// ===== UI
let activePair=""
let activeDir=""

function openTrade(pairName,dir){

    activePair=pairName
    activeDir=dir

    pair.innerText=pairName+" | "+dir

    main.style.display="none"
    chartWindow.style.display="block"
    infoWindow.style.display="flex"
}

function goBack(){

    chartWindow.style.display="none"
    infoWindow.style.display="none"

    main.style.display="block"
}

// ===== CANVAS
const canvas=document.getElementById("chart")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight*0.5

let candles=[]
let current=null
let price=100

function newCandle(p){
    return {open:p,high:p,low:p,close:p}
}

for(let i=0;i<80;i++){
    candles.push(newCandle(price))
}

current=newCandle(price)

// ===== REALTIME
socket.onmessage=(event)=>{

    let data=JSON.parse(event.data)

    price=data.price

    current.high=Math.max(current.high,price)
    current.low=Math.min(current.low,price)
    current.close=price

    priceText.innerText="Price: "+price

    draw()
}

// ===== NEW CANDLE
setInterval(()=>{

    candles.push(current)

    if(candles.length>120){
        candles.shift()
    }

    current=newCandle(price)

},2000)

// ===== DRAG
let dragging=false,startX=0,offsetX=0

canvas.addEventListener("mousedown",e=>{
    dragging=true
    startX=e.clientX
})

canvas.addEventListener("touchstart",e=>{
    dragging=true
    startX=e.touches[0].clientX
})

window.addEventListener("mousemove",e=>{
    if(!dragging)return
    offsetX+=(e.clientX-startX)
    startX=e.clientX
})

window.addEventListener("touchmove",e=>{
    if(!dragging)return
    offsetX+=(e.touches[0].clientX-startX)
    startX=e.touches[0].clientX
})

window.addEventListener("mouseup",()=>dragging=false)
window.addEventListener("touchend",()=>dragging=false)

// ===== DRAW
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height)

    let all=[...candles,current]

    let max=Math.max(...all.map(c=>c.high))
    let min=Math.min(...all.map(c=>c.low))
    let range=max-min||1

    let w=canvas.width/30
    let center=Math.floor(all.length/2)

    all.forEach((c,i)=>{

        let x=(i-center)*w + canvas.width/2 + offsetX

        let scale=canvas.height/range

        let o=canvas.height-(c.open-min)*scale
        let cl=canvas.height-(c.close-min)*scale
        let hi=canvas.height-(c.high-min)*scale
        let lo=canvas.height-(c.low-min)*scale

        let up=c.close>c.open

        ctx.strokeStyle=up?"#00c8ff":"#ff2a6d"
        ctx.lineWidth=1

        ctx.beginPath()
        ctx.moveTo(x+w/2,hi)
        ctx.lineTo(x+w/2,lo)
        ctx.stroke()

        ctx.fillStyle=up?"#ff4dff":"#ff2a6d"

        ctx.fillRect(
            x+w*0.25,
            Math.min(o,cl),
            w*0.5,
            Math.max(2,Math.abs(o-cl))
        )
    })
}

</script>

</body>
</html>
