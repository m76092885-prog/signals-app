<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signals Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    height: 100vh;
    overflow: hidden;
    background: black;
    color: white;
}

/* ===== ФОН (ГРАФИК) ===== */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3") center/cover no-repeat;
    filter: blur(12px) brightness(0.4);
    z-index: 0;
}

/* ===== СТЕКЛЯННАЯ ПАНЕЛЬ ===== */
.container {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px;
}

/* ===== HEADER ===== */
.header {
    text-align: center;
    font-size: 22px;
    margin-bottom: 15px;
}

/* ===== КНОПКИ ===== */
.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 15px;
}

button {
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 10px 15px;
    border-radius: 10px;
    color: white;
    backdrop-filter: blur(10px);
}

/* ===== СИГНАЛЫ ===== */
.signals {
    max-height: 60vh;
    overflow-y: auto;
}

.signal {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
}

.buy { color: #00ff9d; }
.sell { color: #ff4d4d; }

.prob {
    font-size: 14px;
    opacity: 0.8;
}

.time {
    font-size: 11px;
    opacity: 0.5;
}

/* ===== СКРОЛЛ ===== */
.signals::-webkit-scrollbar {
    width: 4px;
}
.signals::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 2px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

    <div class="header">📊 Live Signals</div>

    <div class="buttons">
        <button onclick="loadSignals()">🔄 Refresh</button>
    </div>

    <div class="signals" id="signals"></div>

</div>

<script>
async function loadSignals() {
    const res = await fetch("/signals");
    const data = await res.json();

    const container = document.getElementById("signals");
    container.innerHTML = "";

    data.reverse().forEach(s => {
        const el = document.createElement("div");
        el.className = "signal";

        const side = s.signal === "BUY" ? "buy" : "sell";

        el.innerHTML = `
            <div>
                <b>${s.symbol}</b><br>
                <span class="${side}">${s.signal}</span>
            </div>
            <div style="text-align:right">
                <div class="prob">${s.probability}%</div>
                <div class="time">${new Date(s.time * 1000).toLocaleTimeString()}</div>
            </div>
        `;

        container.appendChild(el);
    });
}

setInterval(loadSignals, 2000);
loadSignals();
</script>

</body>
</html>
