<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signals Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
    background:#020617;
    color:#fff;
    overflow:hidden;
}

/* ===== ФОН ГРАФИК ===== */
#bgChart{
    position:fixed;
    top:50%;
    left:50%;
    width:150%;
    height:150%;
    transform:translate(-50%,-50%);
    filter:blur(8px) brightness(0.5);
    z-index:0;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:radial-gradient(circle,transparent 30%,#020617 80%);
    z-index:1;
}

/* ===== ОСНОВА ===== */
.container{
    position:relative;
    z-index:2;
    height:100vh;
    padding:20px;
    display:flex;
    flex-direction:column;
}

/* ===== СТАТА ===== */
.stats{
    text-align:center;
    margin-bottom:10px;
}

/* ===== СИГНАЛЫ ===== */
.signals{
    overflow:auto;
    flex:1;
}

.signal{
    background:rgba(15,23,42,0.8);
    margin-bottom:10px;
    padding:15px;
    border-radius:18px;
    display:flex;
    justify-content:space-between;
    cursor:pointer;
}

.buy{border-left:4px solid #22c55e}
.sell{border-left:4px solid #ef4444}

/* ===== ЭКРАН СДЕЛКИ ===== */
.trade{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#020617;
    z-index:10;
    display:none;
    flex-direction:column;
}

#tradeChart{
    height:60%;
}

.info{
    padding:15px;
}

.btn{
    margin-top:10px;
    padding:14px;
    border-radius:25px;
    background:#1e293b;
    text-align:center;
}
</style>

</head>

<body>

<audio id="sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<canvas id="bgChart"></canvas>

<div class="overlay"></div>

<div class="container">

```
<div class="stats">
    📊 Winrate (10): <span id="stat">--</span>
</div>

<div class="signals" id="signals"></div>
```

</div>

<!-- ===== TRADE SCREEN ===== -->

<div class="trade" id="trade">
    <canvas id="tradeChart"></canvas>

```
<div class="info">
    <div id="pair"></div>
    <div id="status"></div>
    <div id="reason"></div>
    <div id="timer"></div>

    <div class="btn" onclick="closeTrade()">Назад</div>
</div>
```

</div>

<script>

/* ===== ЗВУК ===== */
let lastTime = 0
function play(){
    let s = document.getElementById("sound")
    s.currentTime=0
    s.play().catch(()=>{})
}

/* ===== ФОН ГРАФИК ===== */
const bg = document.getElementById("bgChart")
const bctx = bg.getContext("2d")

function resize(){
    bg.width = window.innerWidth*1.5
    bg.height = window.innerHeight*1.5
}
resize()

let candles=[]
let price=100

function gen(){
    let open=price
    let close=open+(Math.random()-0.5)*3
    let high=Math.max(open,close)+Math.random()*2
    let low=Math.min(open,close)-Math.random()*2
    price=close
    return {open,close,high,low}
}

for(let i=0;i<120;i++) candles.push(gen())

let offset=0

function drawBg(){
    bctx.clearRect(0,0,bg.width,bg.height)

    const w=8,g=4
    const max=Math.max(...candles.map(c=>c.high))
    const min=Math.min(...candles.map(c=>c.low))
    const scale=bg.height/(max-min)

    candles.forEach((c,i)=>{
        let x=i*(w+g)-offset
        let o=bg.height-(c.open-min)*scale
        let cl=bg.height-(c.close-min)*scale
        let h=bg.height-(c.high-min)*scale
        let l=bg.height-(c.low-min)*scale

        let col=c.close>c.open?"#22c55e":"#ef4444"
        bctx.fillStyle=col
        bctx.strokeStyle=col

        bctx.beginPath()
        bctx.moveTo(x+w/2,h)
        bctx.lineTo(x+w/2,l)
        bctx.stroke()

        bctx.fillRect(x,Math.min(o,cl),w,Math.abs(o-cl))
    })
}

function updateBg(){
    offset+=1.5
    if(offset>12){
        offset=0
        candles.push(gen())
        candles.shift()
    }
    drawBg()
}

setInterval(updateBg,16)

/* ===== СИГНАЛЫ ===== */
async function load(){
    let res=await fetch("/signals")
    let data=await res.json()

    let container=document.getElementById("signals")
    container.innerHTML=""

    let newest=lastTime
    let wins=0

    data.slice(-10).forEach(s=>{
        if(s.probability>70) wins++
    })

    document.getElementById("stat").innerText =
        Math.round((wins/10)*100)+"%"

    data.reverse().forEach(s=>{
        if(s.time>newest) newest=s.time

        let div=document.createElement("div")
        div.className="signal "+(s.signal=="BUY"?"buy":"sell")

        div.innerHTML=`
        <div>
            <b>${s.symbol}</b><br>
            ${s.signal}
        </div>
        <div>${s.probability}%</div>
        `

        div.onclick=()=>openTrade(s)
        container.appendChild(div)
    })

    if(newest>lastTime && lastTime!=0){
        play()
    }

    lastTime=newest
}

setInterval(load,2000)
load()

/* ===== TRADE ===== */
let tcanvas=document.getElementById("tradeChart")
let tctx=tcanvas.getContext("2d")

tcanvas.width=window.innerWidth
tcanvas.height=window.innerHeight*0.6

let trade=null

function openTrade(s){
    trade=s
    document.getElementById("trade").style.display="flex"
    document.getElementById("pair").innerText=s.symbol+" "+s.signal
    document.getElementById("reason").innerText=s.reason||"Signal logic"

    runTrade()
}

function closeTrade(){
    document.getElementById("trade").style.display="none"
}

function runTrade(){
    let entry=trade.entry_price || 100
    let current=entry
    let start=Date.now()

    let interval=setInterval(()=>{
        tctx.clearRect(0,0,tcanvas.width,tcanvas.height)

        current += (Math.random()-0.5)*0.002

        let profit =
            (trade.signal=="BUY" && current>entry) ||
            (trade.signal=="SELL" && current<entry)

        tctx.strokeStyle = profit ? "#22c55e" : "#ef4444"
        tctx.beginPath()
        tctx.moveTo(50,tcanvas.height/2)
        tctx.lineTo(300+(current-entry)*10000,tcanvas.height/2)
        tctx.stroke()

        document.getElementById("status").innerText =
            profit ? "🟢 В профите" : "🔴 В просадке"

        let left = 180 - Math.floor((Date.now()-start)/1000)
        document.getElementById("timer").innerText = "⏱ "+left+"s"

        if(left<=0){
            clearInterval(interval)
        }

    },200)
}
</script>

</body>
</html>
