<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ стабильная версия -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

<style>
body{
    margin:0;
    background:#0b0f1a;
    color:white;
    font-family:Arial;
}

.trade-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:95%;
    height:85%;
    background:#0f172a;
    border-radius:20px;
    display:flex;
    flex-direction:column;
}

#chart{
    flex:1;
}

.panel{
    height:80px;
    background:#020617;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.btn{
    padding:12px 30px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

.buy{ background:#16a34a }
.sell{ background:#dc2626 }

</style>
</head>

<body>

<div class="trade-box">
    <div id="chart"></div>

    <div class="panel">
        <div class="btn buy">CALL</div>
        <div id="price">0.0000</div>
        <div class="btn sell">PUT</div>
    </div>
</div>

<script>

// 🔥 проверка
console.log("Chart lib:", typeof LightweightCharts)

// создаём график
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0f172a' }, textColor: '#aaa' },
    grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } }
})

const candleSeries = chart.addCandlestickSeries()

// WebSocket
const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host + "/ws"
)

ws.onopen = ()=>{
    console.log("WS OK")
}

ws.onmessage = (e)=>{
    const data = JSON.parse(e.data)

    document.getElementById("price").innerText = data.price

    if(data.candles){
        candleSeries.setData(data.candles)
    }
}

ws.onerror = (e)=>{
    console.log("WS ERROR", e)
}

</script>

</body>
</html>
</html>
