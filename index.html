<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#05070d;
    color:white;
    font-family:Arial;
}

/* ===== FLOAT WINDOWS */
.window{
    position:fixed;
    left:10px;
    right:10px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    border:1px solid rgba(56,189,248,0.2);
    box-shadow:0 0 25px rgba(56,189,248,0.15);
}

/* ===== CHART WINDOW */
#chartWindow{
    top:10px;
    height:50vh;

    background:
    linear-gradient(#020617,#020617),
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 1px,
        transparent 1px,
        transparent 40px
    ),
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 1px,
        transparent 1px,
        transparent 40px
    );
}

/* ===== INFO WINDOW */
#infoWindow{
    bottom:10px;
    height:40vh;
    padding:15px;

    background:linear-gradient(145deg,#020617,#020617);
}

/* glow при активности */
.window:hover{
    box-shadow:0 0 35px rgba(56,189,248,0.3);
}

/* ===== BUTTON */
.back{
    display:inline-block;
    padding:10px 16px;
    border-radius:12px;
    background:#111827;
    cursor:pointer;
    margin-bottom:10px;
    transition:.2s;
}

.back:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px rgba(56,189,248,0.4);
}

/* ===== COLORS */
.green{ color:#00ff88 }
.red{ color:#ff3b3b }

/* ===== CANVAS */
canvas{
    width:100%;
    height:100%;
}

</style>
</head>

<body>

<!-- ===== CHART -->
<div id="chartWindow" class="window">
    <canvas id="chart"></canvas>
</div>

<!-- ===== INFO -->
<div id="infoWindow" class="window">

    <div class="back" onclick="back()">← Назад</div>

    <div id="pair"></div>
    <div id="timer"></div>
    <div id="profit"></div>

</div>

<script>

// ===== DATA
let active = {pair:"EUR/USD", direction:"BUY", time:30}

// ===== CANVAS
const canvas = document.getElementById("chart")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight*0.5

let candles=[]
let current=null
let price=100
let entry=0

function newCandle(p){
    return {open:p,high:p,low:p,close:p}
}

// ===== GENERATE HISTORY
function generate(){
    candles=[]
    price=100

    for(let i=0;i<80;i++){
        let o=price
        let c=o+(Math.random()-0.5)*2
        let h=Math.max(o,c)+Math.random()
        let l=Math.min(o,c)-Math.random()

        candles.push({open:o,high:h,low:l,close:c})
        price=c
    }

    current=newCandle(price)
}

// ===== LOOP
let running=true
let last=0
let candleTimer=0
let timeLeft=active.time

function loop(t){

    if(!running) return

    let dt=t-last
    last=t
    candleTimer+=dt

    // движение цены
    price += (Math.random()-0.5)*0.2

    current.high=Math.max(current.high,price)
    current.low=Math.min(current.low,price)
    current.close=price

    // новая свеча
    if(candleTimer>2000){
        candles.push(current)
        if(candles.length>100) candles.shift()
        current=newCandle(price)
        candleTimer=0
    }

    draw()

    // инфо
    timeLeft -= dt/1000
    let profit = price - entry

    document.getElementById("timer").innerText =
        "Time: "+Math.max(0,Math.floor(timeLeft))

    document.getElementById("profit").innerText =
        "P/L: "+profit.toFixed(2)

    document.getElementById("profit").className =
        profit>=0 ? "green" : "red"

    requestAnimationFrame(loop)
}

// ===== DRAW (ЦЕНТР)
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height)

    let all=[...candles,current].filter(Boolean)

    let max=Math.max(...all.map(c=>c.high))
    let min=Math.min(...all.map(c=>c.low))
    let range=max-min || 1

    let centerIndex = Math.floor(all.length/2)
    let w = canvas.width / 20   // фикс ширина

    all.forEach((c,i)=>{

        // 🔥 центрируем
        let x = (i-centerIndex)*w + canvas.width/2

        let scale=canvas.height/range

        let o=canvas.height-(c.open-min)*scale
        let cl=canvas.height-(c.close-min)*scale
        let hi=canvas.height-(c.high-min)*scale
        let lo=canvas.height-(c.low-min)*scale

        let up=c.close>c.open

        ctx.strokeStyle=up?"#00ff88":"#ff3b3b"
        ctx.lineWidth=2

        ctx.beginPath()
        ctx.moveTo(x+w/2,hi)
        ctx.lineTo(x+w/2,lo)
        ctx.stroke()

        ctx.fillStyle=up?"#00ff88":"#ff3b3b"

        ctx.shadowColor=up?"#00ff88":"#ff3b3b"
        ctx.shadowBlur=10

        ctx.fillRect(
            x+w*0.2,
            Math.min(o,cl),
            w*0.6,
            Math.abs(o-cl)||2
        )

        ctx.shadowBlur=0
    })

    // линия входа
    let entryY=canvas.height-((entry-min)/range)*canvas.height

    ctx.strokeStyle="#00e0ff"
    ctx.setLineDash([6,6])

    ctx.beginPath()
    ctx.moveTo(0,entryY)
    ctx.lineTo(canvas.width,entryY)
    ctx.stroke()

    ctx.setLineDash([])
}

// ===== BACK
function back(){
    alert("тут можно вернуть к сигналам")
}

// ===== INIT
document.getElementById("pair").innerText =
    active.pair + " | " + active.direction

generate()
entry = price
last = performance.now()

requestAnimationFrame(loop)

</script>

</body>
</html>
