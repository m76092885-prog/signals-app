<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signals App</title>

<style>
body {
    margin: 0;
    background: #0e0e11;
    color: #fff;
    font-family: Arial;
}

.header {
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #222;
}

.stats {
    display: flex;
    gap: 10px;
    padding: 10px;
}

.card {
    background: #1a1a1f;
    padding: 10px;
    border-radius: 10px;
    flex: 1;
    text-align: center;
}

.signals {
    padding: 10px;
}

.signal {
    background: #1a1a1f;
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.buy { color: #00ff9d; }
.sell { color: #ff4d4d; }

.prob {
    font-size: 14px;
    opacity: 0.8;
}

.time {
    font-size: 12px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="header">📊 Signal Dashboard</div>

<div class="stats">
    <div class="card">
        <div id="total">0</div>
        <small>Signals</small>
    </div>
    <div class="card">
        <div id="winrate">--%</div>
        <small>Winrate</small>
    </div>
</div>

<div class="signals" id="signals"></div>

<script>
async function loadSignals() {
    const res = await fetch("/signals");
    const data = await res.json();

    const container = document.getElementById("signals");
    container.innerHTML = "";

    document.getElementById("total").innerText = data.length;

    data.reverse().forEach(s => {
        const el = document.createElement("div");
        el.className = "signal";

        const side = s.signal === "BUY" ? "buy" : "sell";

        el.innerHTML = `
            <div>
                <b>${s.symbol}</b><br>
                <span class="${side}">${s.signal}</span>
            </div>
            <div style="text-align:right">
                <div class="prob">${s.probability}%</div>
                <div class="time">${new Date(s.time * 1000).toLocaleTimeString()}</div>
            </div>
        `;

        container.appendChild(el);
    });
}

setInterval(loadSignals, 2000);
loadSignals();
</script>

</body>
</html>
